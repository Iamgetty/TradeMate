<title>TradeMate — The Open Market</title>
<style>html,body{background:#050505;margin:0}</style>
<style id="tmboot">body>*:not(#lp){visibility:hidden}</style>
<script>
window.tmReveal=function(){var s=document.getElementById("tmboot");if(s)s.remove()};
window.tmBootFail=function(message){
 window.tmReveal();
 var old=document.getElementById("tm-boot-error");if(old)return;
 var panel=document.createElement("div");panel.id="tm-boot-error";
 panel.style.cssText="position:fixed;z-index:2147483647;inset:0;overflow:auto;background:#050505;color:#fff;padding:28px 20px;font:14px/1.5 system-ui";
 var title=document.createElement("h2");title.textContent="TradeMate could not start";title.style.cssText="font-size:20px;margin:0 0 12px";
 var detail=document.createElement("pre");detail.textContent=String(message||"The app did not finish initializing.").slice(0,1600);detail.style.cssText="white-space:pre-wrap;overflow-wrap:anywhere;color:#e2b8b8;background:#1b1111;border:1px solid #663b3b;border-radius:12px;padding:14px";
 var hint=document.createElement("p");hint.textContent="Share this startup message so the failure can be identified.";hint.style.color="#aab4c0";
 panel.appendChild(title);panel.appendChild(detail);panel.appendChild(hint);document.body.appendChild(panel);
};
window.addEventListener("error",function(e){
 if(e.target&&e.target!==window){
  var src=e.target.src||e.target.href||"";
  if(e.target.tagName==="SCRIPT"&&/\/tm\/(app|feed-client)\.js(?:\?|$)/.test(src))window.tmBootFail("Failed to load script: "+src);
  return;
 }
 window.tmBootFail((e.message||"JavaScript startup error")+(e.filename?"\n"+e.filename+":"+e.lineno+":"+e.colno:""));
},true);
window.addEventListener("unhandledrejection",function(e){
 var reason=e.reason;window.tmBootFail(reason&&reason.stack?reason.stack:reason&&reason.message?reason.message:String(reason||"Unhandled promise rejection"));
});
setTimeout(function(){
 var app=document.getElementById("app"),lp=document.getElementById("lp");
 if(!app||!app.innerHTML.trim()){window.tmBootFail("The app did not render its main screen within 4.5 seconds. Check that /tm/app.js?v=9 loaded successfully.");return}
 if(lp&&(!lp.shadowRoot||!lp.shadowRoot.querySelector(".sc"))){lp.style.display="none";}
 window.tmReveal();
},4500);
</script>>>
