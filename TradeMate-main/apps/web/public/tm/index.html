<!DOCTYPE html>
<html lang="en" style="background:#050505">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>TradeMate — The Open Market</title>
<style>html,body{background:#050505;margin:0}</style>
<style id="tmboot">body>*:not(#lp){visibility:hidden}</style>
<script>
window.tmReveal=function(){var s=document.getElementById("tmboot");if(s)s.remove()};
window.addEventListener("error",function(e){window.tmReveal();var lp=document.getElementById("lp");if(lp){lp.style.display="none";}var app=document.getElementById("app");if(app&&!app.innerHTML.trim()){app.innerHTML='<div style="margin:24px;padding:18px;border:1px solid #663b3b;border-radius:14px;background:#1b1111;color:#fff;font:14px system-ui"><b>TradeMate could not start</b><p style="color:#d7bcbc">A startup error occurred. Please refresh and try again.</p><small style="color:#b99">Error: '+String(e.message||"Unknown startup error").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</small></div>'; }});
window.addEventListener("unhandledrejection",function(e){window.tmReveal();});
setTimeout(window.tmReveal,2500);
</script>
</head>
<body>
<noscript style="color:#fff;font:16px sans-serif;padding:24px;display:block">TradeMate needs JavaScript to run.</noscript>
<!-- Same-origin API: /api is proxied to the NestJS service by apps/web/app/api/[...path]/route.ts -->
<script>window.TM_CONFIG={api:"/api"};</script>
<script defer src="/tm/feed-client.js"></script>
<script defer src="/tm/app.js?v=8"></script>
</body>
</html>
