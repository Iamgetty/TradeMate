services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trademate
      POSTGRES_USER: trademate
      POSTGRES_PASSWORD: local_dev_only
    ports: ["5432:5432"]
    volumes: ["trademate_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademate -d trademate"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["trademate_redisdata:/data"]
volumes:
  trademate_pgdata:
  trademate_redisdata:
