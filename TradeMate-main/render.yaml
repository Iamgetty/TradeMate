# TradeMate deployment. PostgreSQL is configured separately in Render.
services:
  - type: web
    name: trademate-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://trademate-web.onrender.com
  - type: web
    name: trademate-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://trademate-api-toip.onrender.com
