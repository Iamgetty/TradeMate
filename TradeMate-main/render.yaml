# TradeMate deployment. PostgreSQL is configured separately in Render.
services:
  - type: web
    name: trademate-api
    runtime: node
    plan: free
    rootDir: TradeMate-main/apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://trademate-web.onrender.com
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
  - type: web
    name: exchange-feed
    runtime: node
    plan: free
    rootDir: TradeMate-main/exchange-feed
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
  - type: web
    name: trademate-web
    runtime: node
    plan: free
    rootDir: TradeMate-main/apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://trademate-api-toip.onrender.com
