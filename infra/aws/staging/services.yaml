            - Name: WEB_ORIGIN
              Value: !Ref ApiWebOrigin
            - Name: PGSSLMODE
              Value: require
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref ApiDatabaseUrlSecretArn
            - Name: TOTP_ENCRYPTION_KEY
              ValueFrom: !Ref TotpEncryptionKeySecretArn
          HealthCheck:
            Command:
              - CMD-SHELL
              - "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/api"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-database-migration"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt MigrationEcsExecutionRole.Arn
      TaskRoleArn: !GetAtt MigrationTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: database-migration
          Image: !Ref ApiImageUri
          Essential: true
          Command:
            - node
            - scripts/migrate.js
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PGSSLMODE
              Value: require
          Secrets:
            - Name: MIGRATION_DATABASE_URL
              ValueFrom: !Ref MigrationDatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/api"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration

  FeedTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-exchange-feed"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt FeedTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: exchange-feed
          Image: !Ref ExchangeFeedImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3000"
            - Name: MT5_PUBLIC_BROADCAST_ENABLED
              Value: "false"
            - Name: MT5_REDISTRIBUTION_PERMISSION_CONFIRMED
              Value: "false"
          HealthCheck:
            Command:
              - CMD-SHELL
              - "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/exchange-feed"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  CloudflareTunnelService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${EnvironmentName}-cloudflare-tunnel"
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      AvailabilityZoneRebalancing: ENABLED
      DesiredCount: !Ref TunnelDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      TaskDefinition: !Ref CloudflareTunnelTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateAppSubnetA
            - !Ref PrivateAppSubnetB
          SecurityGroups:
            - !Ref CloudflareTunnelSecurityGroupId

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiListenerRule
    Properties:
      ServiceName: !Sub "${EnvironmentName}-api"
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref ApiDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      TaskDefinition: !Ref ApiTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateAppSubnetA
            - !Ref PrivateAppSubnetB
          SecurityGroups:
            - !Ref ApiSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup

  FeedService:
    Type: AWS::ECS::Service
    DependsOn:
      - FeedListenerRule
    Properties:
      ServiceName: !Sub "${EnvironmentName}-exchange-feed"
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref FeedDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      TaskDefinition: !Ref FeedTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateAppSubnetA
            - !Ref PrivateAppSubnetB
          SecurityGroups:
            - !Ref ExchangeFeedSecurityGroupId
      LoadBalancers:
        - ContainerName: exchange-feed
          ContainerPort: 3000
          TargetGroupArn: !Ref FeedTargetGroup

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt Alb.DNSName
  ApiUrl:
    Value: !Sub "https://${ApiHostHeader}"
  ExchangeFeedUrl:
    Value: !Sub "wss://${FeedHostHeader}"
  ApiTaskDefinitionArn:
    Value: !Ref ApiTaskDefinition
  ExchangeFeedTaskDefinitionArn:
    Value: !Ref FeedTaskDefinition
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
  CloudflareTunnelTaskDefinitionArn:
    Value: !Ref CloudflareTunnelTaskDefinition
  CloudflareTunnelServiceName:
    Value: !Sub "${EnvironmentName}-cloudflare-tunnel"
