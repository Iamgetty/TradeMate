AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TradeMate staging ALB and ECS Fargate services. Requires the network foundation
  stack and pre-created staging secrets; no production endpoints are configured.

Parameters:
  EnvironmentName:
    Type: String
    Default: trademate-staging
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateAppSubnetB:
    Type: AWS::EC2::Subnet::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ApiSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ExchangeFeedSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  CloudflareTunnelSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EcsClusterName:
    Type: String
  ApiImageUri:
    Type: String
    Description: Immutable ECR image URI including a commit-SHA tag.
  ExchangeFeedImageUri:
    Type: String
    Description: Immutable ECR image URI including a commit-SHA tag.
  ApiDatabaseUrlSecretArn:
    Type: String
    Description: Secrets Manager ARN whose SecretString is the complete staging DATABASE_URL.
  TotpEncryptionKeySecretArn:
    Type: String
    Description: Secrets Manager ARN whose SecretString contains the 64-character hex TOTP_ENCRYPTION_KEY.
  MigrationDatabaseUrlSecretArn:
    Type: String
    Description: Separate Secrets Manager ARN whose SecretString is the migrator-role PostgreSQL URL; never use the master or app-role credential.
  CloudflareTunnelTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the Cloudflare Tunnel token for this staging environment.
  CloudflaredImageUri:
    Type: String
    Description: Cloudflare cloudflared container image pinned to an immutable SHA-256 digest.
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}  ApiWebOrigin:
    Type: String
    Description: Exact HTTPS origin of the isolated Cloudflare staging frontend.
    AllowedPattern: "^https://[^/]+$"
  ApiHostHeader:
    Type: String
    Description: Staging API hostname routed to the API service.
  FeedHostHeader:
    Type: String
    Description: Staging WebSocket feed hostname routed to the exchange-feed service.
  CertificateArn:
    Type: String
    Description: ACM certificate in this region covering both staging hostnames.
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  FeedDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  TunnelDesiredCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 4

Resources:
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Type: application
      Scheme: internal
      IpAddressType: ipv4
      Subnets:
        - !Ref PrivateAppSubnetA
        - !Ref PrivateAppSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "3600"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Environment
          Value: staging
        - Key: Project
          Value: TradeMate

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-api"
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      Matcher:
        HttpCode: "200"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  FeedTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-feed"
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "60"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: "Not found"

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref ApiHostHeader
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  FeedListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref FeedHostHeader
      Actions:
        - Type: forward
          TargetGroupArn: !Ref FeedTargetGroup

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadTradeMateStagingRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ApiDatabaseUrlSecretArn
                  - !Ref TotpEncryptionKeySecretArn

  CloudflareTunnelExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOnlyCloudflareTunnelToken
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref CloudflareTunnelTokenSecretArn

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  FeedTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  MigrationEcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadOnlyMigratorSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref MigrationDatabaseUrlSecretArn

  MigrationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  CloudflareTunnelTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-cloudflare-tunnel"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt CloudflareTunnelExecutionRole.Arn
      TaskRoleArn: !GetAtt CloudflareTunnelTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: cloudflared
          Image: !Ref CloudflaredImageUri
          Essential: true
          Command:
            - tunnel
            - --no-autoupdate
            - run
          Secrets:
            - Name: TUNNEL_TOKEN
              ValueFrom: !Ref CloudflareTunnelTokenSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/cloudflare-tunnel"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  CloudflareTunnelTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "4000"
            - Name: WEB_ORIGIN
              Value: !Ref ApiWebOrigin
            - Name: PGSSLMODE
              Value: require
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref ApiDatabaseUrlSecretArn
            - Name: TOTP_ENCRYPTION_KEY
              ValueFrom: !Ref TotpEncryptionKeySecretArn
          HealthCheck:
            Command:
              - CMD-SHELL
              - |
                node -e "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/api"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-database-migration"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt MigrationEcsExecutionRole.Arn
      TaskRoleArn: !GetAtt MigrationTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: database-migration
          Image: !Ref ApiImageUri
          Essential: true
          Command:
            - node
            - scripts/migrate.js
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PGSSLMODE
              Value: require
          Secrets:
            - Name: MIGRATION_DATABASE_URL
              ValueFrom: !Ref MigrationDatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/api"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration

  FeedTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-exchange-feed"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt FeedTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: exchange-feed
          Image: !Ref ExchangeFeedImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3000"
            - Name: MT5_PUBLIC_BROADCAST_ENABLED
              Value: "false"
            - Name: MT5_REDISTRIBUTION_PERMISSION_CONFIRMED
              Value: "false"
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                node -e "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/trademate/${EnvironmentName}/exchange-feed"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  CloudflareTunnelService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${EnvironmentName}-cloudflare-tunnel"
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      AvailabilityZoneRebalancing: ENABLED
      DesiredCount: !Ref TunnelDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      TaskDefinition: !Ref CloudflareTunnelTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateAppSubnetA
            - !Ref PrivateAppSubnetB
          SecurityGroups:
            - !Ref CloudflareTunnelSecurityGroupId

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiListenerRule
    Properties:
      ServiceName: !Sub "${EnvironmentName}-api"
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref ApiDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      TaskDefinition: !Ref ApiTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateAppSubnetA
            - !Ref PrivateAppSubnetB
          SecurityGroups:
            - !Ref ApiSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup

  FeedService:
    Type: AWS::ECS::Service
    DependsOn:
      - FeedListenerRule
    Properties:
      ServiceName: !Sub "${EnvironmentName}-exchange-feed"
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref FeedDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      TaskDefinition: !Ref FeedTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateAppSubnetA
            - !Ref PrivateAppSubnetB
          SecurityGroups:
            - !Ref ExchangeFeedSecurityGroupId
      LoadBalancers:
        - ContainerName: exchange-feed
          ContainerPort: 3000
          TargetGroupArn: !Ref FeedTargetGroup

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt Alb.DNSName
  ApiUrl:
    Value: !Sub "https://${ApiHostHeader}"
  ExchangeFeedUrl:
    Value: !Sub "wss://${FeedHostHeader}"
  ApiTaskDefinitionArn:
    Value: !Ref ApiTaskDefinition
  ExchangeFeedTaskDefinitionArn:
    Value: !Ref FeedTaskDefinition
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
  CloudflareTunnelTaskDefinitionArn:
    Value: !Ref CloudflareTunnelTaskDefinition
  CloudflareTunnelServiceName:
    Value: !Sub "${EnvironmentName}-cloudflare-tunnel"

    ConstraintDescription: Provide an image URI ending in @sha256: followed by 64 lowercase hexadecimal characters.
  ApiWebOrigin:
    Type: String
    Description: Exact HTTPS origin of the isolated Cloudflare staging frontend.
    AllowedPattern: "^https://[^/]+$"
  ApiHostHeader:
    Type: String
    Description: Staging API hostname routed to the API service.
  FeedHostHeader:
    Type: String
    Description: Staging WebSocket feed hostname routed to the exchange-feed service.
  CertificateArn:
    Type: String
    Description: ACM certificate in this region covering both staging hostnames.
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  FeedDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  TunnelDesiredCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 4

