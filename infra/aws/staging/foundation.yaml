AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TradeMate AWS staging network and container foundation. Creates infrastructure
  only when explicitly deployed; this repository change does not deploy it.

Parameters:
  EnvironmentName:
    Type: String
    Default: trademate-staging
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
  NatPublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  ExistingDatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ExistingDatabaseSubnetIds:
    Type: CommaDelimitedList
  AppAvailabilityZoneA:
    Type: String
    Default: eu-north-1a
  AppAvailabilityZoneB:
    Type: String
    Default: eu-north-1b
  PrivateAppSubnetACidr:
    Type: String
    Default: 172.31.48.0/24
  PrivateAppSubnetBCidr:
    Type: String
    Default: 172.31.49.0/24

Resources:
  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Ref AppAvailabilityZoneA
      CidrBlock: !Ref PrivateAppSubnetACidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-a"
  PrivateAppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Ref AppAvailabilityZoneB
      CidrBlock: !Ref PrivateAppSubnetBCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-b"
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref NatPublicSubnetId
  PrivateAppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
  PrivateAppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
  PrivateAppDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateAppRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAppDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateAppRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAppSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnetA
      RouteTableId: !Ref PrivateAppRouteTableA
  PrivateAppSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnetB
      RouteTableId: !Ref PrivateAppRouteTableB

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private ALB ingress only from the Cloudflare Tunnel connector
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref CloudflareTunnelSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb-sg"

  CloudflareTunnelSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only Cloudflare Tunnel connector tasks
      VpcId: !Ref ExistingVpcId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-cloudflare-tunnel-sg"

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TradeMate API tasks; ingress only from the ALB
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-api-sg"

  ExchangeFeedSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TradeMate exchange-feed tasks; ingress only from the ALB
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-feed-sg"

  MigrationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: One-off authorized database migration tasks
      VpcId: !Ref ExistingVpcId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-migration-sg"

  ExistingDatabaseApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ExistingDatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup
  ExistingDatabaseMigrationIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ExistingDatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref MigrationSecurityGroup

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: staging
        - Key: Project
          Value: TradeMate

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: trademate/api
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 most recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  ExchangeFeedRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: trademate/exchange-feed
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 30 most recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/trademate/${EnvironmentName}/api"
      RetentionInDays: 30

  ExchangeFeedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/trademate/${EnvironmentName}/exchange-feed"
      RetentionInDays: 30

  CloudflareTunnelLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/trademate/${EnvironmentName}/cloudflare-tunnel"
      RetentionInDays: 30

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingVpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateAppRouteTableA
        - !Ref PrivateAppRouteTableB

Outputs:
  VpcId:
    Value: !Ref ExistingVpcId
  PublicSubnetIds:
    Value: !Ref NatPublicSubnetId
  PrivateAppSubnetIds:
    Value: !Join [",", [!Ref PrivateAppSubnetA, !Ref PrivateAppSubnetB]]
  PrivateDbSubnetIds:
    Value: !Join [",", !Ref ExistingDatabaseSubnetIds]
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  CloudflareTunnelSecurityGroupId:
    Value: !Ref CloudflareTunnelSecurityGroup
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
  ExchangeFeedSecurityGroupId:
    Value: !Ref ExchangeFeedSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref ExistingDatabaseSecurityGroupId
  MigrationSecurityGroupId:
    Value: !Ref MigrationSecurityGroup
  EcsClusterName:
    Value: !Ref EcsCluster
  ApiEcrRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  ExchangeFeedEcrRepositoryUri:
    Value: !GetAtt ExchangeFeedRepository.RepositoryUri
