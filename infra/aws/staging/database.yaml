AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TradeMate staging PostgreSQL database. Uses private database subnets and an
  AWS-managed master secret; application credentials are provisioned separately.

Parameters:
  EnvironmentName:
    Type: String
    Default: trademate-staging
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
  PrivateDbSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateDbSubnetB:
    Type: AWS::EC2::Subnet::Id
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EngineVersion:
    Type: String
    Description: Explicit PostgreSQL 18 minor version verified in the selected AWS region.
    AllowedPattern: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
  DBInstanceClass:
    Type: String
    Default: db.t4g.small
    Description: Select a class supported by the chosen PostgreSQL engine version and region.
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  MaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 100
    MaxValue: 1000
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable Multi-AZ only after reviewing staging cost and availability needs.
  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable deletion protection for long-lived staging databases.

Conditions:
  EnableMultiAZ: !Equals [!Ref MultiAZ, "true"]
  EnableDeletionProtection: !Equals [!Ref DeletionProtection, "true"]

Resources:
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${EnvironmentName}-db-subnets"
      DBSubnetGroupDescription: Private TradeMate staging database subnets
      SubnetIds:
        - !Ref PrivateDbSubnetA
        - !Ref PrivateDbSubnetB
      Tags:
        - Key: Environment
          Value: staging
        - Key: Project
          Value: TradeMate

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgres"
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      DBName: trademate
      MasterUsername: trademate_admin
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref AllocatedStorage
      MaxAllocatedStorage: !Ref MaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      CopyTagsToSnapshot: true
      MultiAZ: !If [EnableMultiAZ, true, false]
      DeletionProtection: !If [EnableDeletionProtection, true, false]
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId
      PreferredBackupWindow: "03:00-03:30"
      PreferredMaintenanceWindow: "sun:04:00-sun:04:30"
      Tags:
        - Key: Environment
          Value: staging
        - Key: Project
          Value: TradeMate
        - Key: DataClassification
          Value: staging

Outputs:
  DatabaseEndpointAddress:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseEndpointPort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: trademate
  MasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroupId
