name: AWS Staging Configure Resend Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/configure-resend'

permissions:
  contents: read

concurrency:
  group: trademate-aws-staging-resend-runtime
  cancel-in-progress: false

jobs:
  configure:
    name: Install Resend settings on the staging EC2 API
    runs-on: [self-hosted, Linux, X64, aws-staging]
    timeout-minutes: 10
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - name: Validate secrets and safely configure the staging API
        shell: bash
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${RESEND_API_KEY:-}" || -z "${RESEND_FROM_EMAIL:-}" ]]; then
            echo "::error::Both required repository secrets must be available to this workflow."
            exit 1
          fi
          if [[ ! "$RESEND_API_KEY" =~ ^re_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::RESEND_API_KEY does not have the expected Resend key format. The value was not displayed."
            exit 1
          fi
          if [[ ! "$RESEND_FROM_EMAIL" =~ ^[^[:space:]@<>]+@[^[:space:]@<>]+\.[^[:space:]@<>]+$ ]]; then
            echo "::error::RESEND_FROM_EMAIL must be a plain email address for this staging configuration."
            exit 1
          fi

          sudo -n true || {
            echo "::error::The existing staging runner does not have non-interactive sudo access. No files or services were changed."
            exit 1
          }

          ENV_FILES="$(sudo -n systemctl show trademate-api.service --property=EnvironmentFiles --value)"
          if [[ "$ENV_FILES" != *"/etc/trademate/api.env"* ]]; then
            echo "::error::The staging API systemd unit is not confirmed to load /etc/trademate/api.env. Refusing to modify the host."
            exit 1
          fi

          python3 - <<'PY' | sudo -n python3 -c 'import json, os, re, subprocess, sys, tempfile, time
data = json.load(sys.stdin)
api_key = data["api_key"]
from_email = data["from_email"]
if not api_key.startswith("re_") or any(c in api_key for c in "\\r\\n\\x00"):
    raise SystemExit("Secret validation failed; no value was displayed.")
if not re.fullmatch(r"[^\\s@<>]+@[^\\s@<>]+\\.[^\\s@<>]+", from_email):
    raise SystemExit("Sender validation failed; no value was displayed.")
path = "/etc/trademate/api.env"
directory = os.path.dirname(path)
os.makedirs(directory, mode=0o700, exist_ok=True)
try:
    with open(path, "r", encoding="utf-8") as f:
        existing = f.read()
except FileNotFoundError:
    existing = ""
lines = [line for line in existing.splitlines() if not re.match(r"^\\s*(?:RESEND_API_KEY|RESEND_FROM_EMAIL)\\s*=", line)]
def quote(value):
    if any(c in value for c in "\\r\\n\\x00"):
        raise SystemExit("Environment value contains an unsupported control character.")
    return "\\\"" + value.replace("\\\\", "\\\\\\\\").replace("\\\"", "\\\\\\\"") + "\\\""
new_content = "\\n".join(lines).rstrip("\\n")
if new_content:
    new_content += "\\n"
new_content += "RESEND_API_KEY=" + quote(api_key) + "\\n"
new_content += "RESEND_FROM_EMAIL=" + quote(from_email) + "\\n"
fd, temporary = tempfile.mkstemp(prefix=".api.env.", dir=directory)
try:
    os.fchmod(fd, 0o600)
    with os.fdopen(fd, "w", encoding="utf-8") as f:
        f.write(new_content)
        f.flush()
        os.fsync(f.fileno())
    os.chown(temporary, 0, 0)
    os.replace(temporary, path)
    dfd = os.open(directory, os.O_DIRECTORY)
    try:
        os.fsync(dfd)
    finally:
        os.close(dfd)
finally:
    if os.path.exists(temporary):
        os.unlink(temporary)
subprocess.run(["systemctl", "restart", "trademate-api.service"], check=True, timeout=60)
time.sleep(2)
if subprocess.run(["systemctl", "is-active", "--quiet", "trademate-api.service"]).returncode != 0:
    raise SystemExit("The staging API did not become active after restart.")
pid = subprocess.check_output(["systemctl", "show", "trademate-api.service", "--property=MainPID", "--value"], text=True).strip()
if not pid.isdigit() or pid == "0":
    raise SystemExit("The staging API has no active main process.")
with open("/proc/" + pid + "/environ", "rb") as f:
    entries = dict(item.split(b"=", 1) for item in f.read().split(b"\\x00") if b"=" in item)
if entries.get(b"RESEND_API_KEY", b"").decode() != api_key or entries.get(b"RESEND_FROM_EMAIL", b"").decode() != from_email:
    raise SystemExit("The restarted API process did not load both Resend settings.")
if os.stat(path).st_mode & 0o777 != 0o600:
    raise SystemExit("The runtime environment file permissions are not 0600.")
print("Resend runtime configuration installed; both settings are loaded by the active staging API process.")
print("Secret values were not printed. File permissions: 0600. Service: active.")
'
          import json
          import os
          import sys
          json.dump({
              "api_key": os.environ["RESEND_API_KEY"],
              "from_email": os.environ["RESEND_FROM_EMAIL"],
          }, sys.stdout)
          PY