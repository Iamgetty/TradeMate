name: Apply credential operations patch (one-off)

on:
  push:
    branches:
      - fix/audit-remediation-2026-11-18
    paths:
      - '.github/workflows/apply-credential-ops-patch.yml'

permissions:
  contents: write

concurrency:
  group: apply-credential-ops-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/audit-remediation-2026-11-18
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Apply patch to API module
        run: node .github/patches/apply-credential-ops-patch.js TradeMate-main/apps/api/src/module.ts
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Route registration and password change through scoped credential operations'
          git push origin HEAD:fix/audit-remediation-2026-11-18
