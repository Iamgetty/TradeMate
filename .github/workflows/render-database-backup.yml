name: Encrypted Render PostgreSQL backup to private GitHub repository

on:
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: "Type BACKUP to run a read-only pg_dump"
        required: true
        type: string
      backup_repo:
        description: "Private backup repository (owner/name)"
        required: true
        type: string
        default: "Iamgetty/TradeMate-db-backups"

permissions:
  contents: read

concurrency:
  group: trademate-render-db-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, and push Render DB backup
    if: ${{ inputs.confirm_backup == 'BACKUP' }}
    runs-on: [self-hosted, Linux, X64, aws-staging]
    timeout-minutes: 45
    env:
      RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      BACKUP_REPO: ${{ inputs.backup_repo }}
    steps:
      - name: Create encrypted dump and push only ciphertext to private repository
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$RENDER_DATABASE_URL" ]] || { echo "::error::Missing RENDER_DATABASE_URL"; exit 1; }
          [[ -n "$AGE_RECIPIENT" ]] || { echo "::error::Missing AGE_RECIPIENT"; exit 1; }
          [[ "$AGE_RECIPIENT" == age1* ]] || { echo "::error::AGE_RECIPIENT must be an age public recipient"; exit 1; }
          [[ -n "$BACKUP_REPO_TOKEN" ]] || { echo "::error::Missing BACKUP_REPO_TOKEN"; exit 1; }
          [[ "$BACKUP_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid private repo owner/name"; exit 1; }
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          command -v git >/dev/null
          if ! command -v age >/dev/null; then mkdir -p /tmp/tm-age-install; curl -fsSL 'https://dl.filippo.io/age/v1.3.2?for=linux/amd64' -o /tmp/tm-age-install/age.tar.gz; echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/tm-age-install/age.tar.gz' | sha256sum -c -; tar -xzf /tmp/tm-age-install/age.tar.gz -C /tmp/tm-age-install; sudo find /tmp/tm-age-install -type f -name age -perm -u+x -exec install -m 755 {} /usr/local/bin/age \\; ; rm -rf /tmp/tm-age-install; fi
          pg_dump --version
          age --version
          W="$(mktemp -d "${RUNNER_TEMP:-/tmp}/tm-render-backup.XXXXXX")"
          trap 'rm -rf "$W"' EXIT
          plain="$W/render-trademate.dump"
          encrypted="$W/render-trademate.dump.age"
          pg_dump --no-password --dbname="$RENDER_DATABASE_URL" --format=custom --compress=6 --no-owner --no-acl --file="$plain"
          test -s "$plain"
          pg_restore --list "$plain" >/dev/null
          age -r "$AGE_RECIPIENT" -o "$encrypted" "$plain"
          test -s "$encrypted"
          head -c 20 "$encrypted" | grep -q 'age-encryption.org/v1'
          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "Validated dump and ciphertext created."
          echo "Encrypted size: $(stat -c '%s' "$encrypted") bytes"
          echo "Ciphertext SHA-256: $(cut -d ' ' -f1 "$encrypted.sha256")"
          rm -f "$plain"
          unset RENDER_DATABASE_URL
          # Git uses askpass; token is not placed in the clone URL or command args.
          cat > "$W/askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$BACKUP_REPO_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$W/askpass.sh"
          GIT_ASKPASS="$W/askpass.sh" GIT_TERMINAL_PROMPT=0 git clone --quiet "https://github.com/$BACKUP_REPO.git" "$W/repo"
          cd "$W/repo"
          mkdir -p backups/render
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp "$encrypted" "backups/render/render-trademate-$timestamp.dump.age"
          cp "$encrypted.sha256" "backups/render/render-trademate-$timestamp.dump.age.sha256"
          git add backups/render/
          git -c user.name='TradeMate Backup Bot' -c user.email='backup-bot@users.noreply.github.com' commit -m "backup: encrypted Render PostgreSQL $timestamp"
          GIT_ASKPASS="$W/askpass.sh" GIT_TERMINAL_PROMPT=0 git push --quiet origin HEAD
          echo "Ciphertext stored in private repository: $BACKUP_REPO"
          echo "Plaintext dump was deleted locally; no GitHub Actions artifact was uploaded."
