name: Encrypted Render PostgreSQL backup to private GitHub repository

on:
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: "Type BACKUP to run a read-only pg_dump"
        required: true
        type: string
      backup_repo:
        description: "Private backup repository (owner/name)"
        required: true
        type: string
        default: "Iamgetty/TradeMate-db-backups"

permissions:
  contents: read

concurrency:
  group: trademate-render-db-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, and push Render DB backup
    if: ${{ inputs.confirm_backup == 'BACKUP' }}
    runs-on: [self-hosted, Linux, X64, aws-staging]
    timeout-minutes: 45
    env:
      RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      BACKUP_REPO: ${{ inputs.backup_repo }}
    steps:
      - name: Create encrypted dump and push only ciphertext to private repository
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$RENDER_DATABASE_URL" ]] || { echo "::error::Missing RENDER_DATABASE_URL"; exit 1; }
          [[ -n "$AGE_RECIPIENT" ]] || { echo "::error::Missing AGE_RECIPIENT"; exit 1; }
          [[ "$AGE_RECIPIENT" == age1* ]] || { echo "::error::AGE_RECIPIENT must be an age public recipient"; exit 1; }
          [[ -n "$BACKUP_REPO_TOKEN" ]] || { echo "::error::Missing BACKUP_REPO_TOKEN"; exit 1; }
          [[ "$BACKUP_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid private repo owner/name"; exit 1; }
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          command -v git >/dev/null
          if ! command -v age >/dev/null; then mkdir -p /tmp/tm-age-install; curl -fsSL 'https://dl.filippo.io/age/v1.3.2?for=linux/amd64' -o /tmp/tm-age-install/age.tar.gz; echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/tm-age-install/age.tar.gz' | sha256sum -c -; tar -xzf /tmp/tm-age-install/age.tar.gz -C /tmp/tm-age-install; age_binary=$(find /tmp/tm-age-install -type f -name age -perm -u+x -print -quit); test -n "$age_binary"; sudo install -m 755 "$age_binary" /usr/local/bin/age; rm -rf /tmp/tm-age-install; fi
          pg_dump --version
          age --version
          W="$(mktemp -d "${RUNNER_TEMP:-/tmp}/tm-render-backup.XXXXXX")"
          trap 'rm -rf "$W"' EXIT
          plain="$W/render-trademate.dump"
          encrypted="$W/render-trademate.dump.age"
          pg_dump --no-password --dbname="$RENDER_DATABASE_URL" --format=custom --compress=6 --no-owner --no-acl --file="$plain"
          test -s "$plain"
          pg_restore --list "$plain" >/dev/null
          age -r "$AGE_RECIPIENT" -o "$encrypted" "$plain"
          test -s "$encrypted"
          head -c 20 "$encrypted" | grep -q 'age-encryption.org/v1'
          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "Validated dump and ciphertext created."
          echo "Encrypted size: $(stat -c '%s' "$encrypted") bytes"
          echo "Ciphertext SHA-256: $(cut -d ' ' -f1 "$encrypted.sha256")"
          rm -f "$plain"
          unset RENDER_DATABASE_URL
                # Upload encrypted backup as private Release assets, avoiding Git file-size and history bloat.
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          tag="render-db-backup-$timestamp"
          split -b 900m --numeric-suffixes=1 --suffix-length=3 "$encrypted" "$W/chunk-"
          (cd "$W" && sha256sum chunk-* > SHA256SUMS)
          auth_config="$W/curl-auth.conf"
          printf 'header = "Authorization: Bearer %s"\\n' "$BACKUP_REPO_TOKEN" > "$auth_config"
          chmod 600 "$auth_config"
          release_payload="$W/release.json"
          python3 - "$tag" > "$release_payload" <<'PY'
          import json,sys
          tag=sys.argv[1]
          print(json.dumps({"tag_name":tag,"name":tag,"draft":False,"prerelease":False,"body":"Encrypted age backup. Reassemble numbered 900MB chunks in order, then verify SHA256SUMS before decrypting."}))
          PY
          release_response="$W/release-response.json"
          curl --config "$auth_config" -fsS -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' --data-binary "@$release_payload" "https://api.github.com/repos/$BACKUP_REPO/releases" > "$release_response"
          release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$release_response")"
          upload_asset() {
            local file="$1" name expected response actual
            name="$(basename "$file")"
            expected="$(stat -c '%s' "$file")"
            response="$W/upload-response.json"
            curl --config "$auth_config" -fsS -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/octet-stream' --data-binary "@$file" "https://uploads.github.com/repos/$BACKUP_REPO/releases/$release_id/assets?name=$name" > "$response"
            actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["size"])' "$response")"
            [[ "$actual" == "$expected" ]] || { echo "::error::Upload size verification failed for $name"; exit 1; }
            echo "Uploaded asset verified by size: $name ($actual bytes)"
          }
          for part in "$W"/chunk-*; do upload_asset "$part"; done
          upload_asset "$W/SHA256SUMS"
          echo "Encrypted backup uploaded to private release $tag in $BACKUP_REPO"
          echo "Ciphertext only; plaintext dump deleted; no Actions artifact uploaded."
