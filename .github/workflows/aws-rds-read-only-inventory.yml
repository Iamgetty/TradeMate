name: AWS RDS Read-Only Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-rds-read-only-inventory
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect staging RDS without modifying it
    runs-on: [self-hosted, linux, x64, aws-staging]
    timeout-minutes: 8
    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      SECRET_ID: trademate/staging/api
    steps:
      - name: Retrieve credentials safely and run read-only SQL inventory
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { echo "::error::psql is not installed; no package was installed."; exit 1; }

          secret_json="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)"
          [[ -n "$secret_json" && "$secret_json" != "None" ]] || { echo "::error::SecretString is empty or unavailable."; exit 1; }

          # Parse into process-local shell variables; never write credentials to GITHUB_ENV or step outputs.
          mapfile -t fields < <(SECRET_JSON="$secret_json" python3 - <<'PY'
          import json, os, sys
          from urllib.parse import urlsplit, unquote
          data = json.loads(os.environ["SECRET_JSON"])
          url = data.get("DATABASE_URL")
          if not isinstance(url, str) or not url:
              raise SystemExit("DATABASE_URL is missing.")
          p = urlsplit(url)
          if p.scheme not in ("postgres", "postgresql") or not p.hostname:
              raise SystemExit("DATABASE_URL is not a valid PostgreSQL URL.")
          values = [p.hostname, str(p.port or 5432), unquote(p.username or ""),
                    unquote(p.password or ""), unquote(p.path.lstrip("/")),
                    data.get("PGSSLMODE") or "require"]
          if values[0] != "trademate-db.cnoaequa8k6z.eu-north-1.rds.amazonaws.com":
              raise SystemExit("DATABASE_URL host does not match approved staging RDS.")
          if not all(values[i] for i in (2, 3, 4)):
              raise SystemExit("DATABASE_URL is missing required connection fields.")
          if "\n" in "\n".join(values) or any("\r" in x for x in values):
              raise SystemExit("Unexpected newline in connection fields.")
          for value in values:
              print(value)
          PY
          )
          unset secret_json
          [[ "${#fields[@]}" -eq 6 ]] || { echo "::error::Could not safely parse database connection fields."; exit 1; }

          for value in "${fields[@]}"; do echo "::add-mask::$value"; done
          export PGHOST="${fields[0]}" PGPORT="${fields[1]}" PGUSER="${fields[2]}"
          export PGPASSWORD="${fields[3]}" PGDATABASE="${fields[4]}" PGSSLMODE="${fields[5]}"
          unset fields

          psql --no-psqlrc --no-align --tuples-only --set=ON_ERROR_STOP=1 <<'SQL'
          BEGIN READ ONLY;
          SELECT 'DATABASE' AS section, current_database() AS database_name,
                 current_user AS connected_role, current_setting('server_version') AS postgres_version;
          SELECT 'TLS' AS section, ssl AS tls_in_use FROM pg_stat_ssl WHERE pid = pg_backend_pid();
          SELECT 'APPLICATION_ROLES' AS section, rolname, rolcanlogin, rolsuper,
                 rolcreatedb, rolcreaterole, rolbypassrls
          FROM pg_roles
          WHERE rolname IN ('trademate_app','trademate_migrator','trademate_worker')
          ORDER BY rolname;
          SELECT 'EXTENSIONS' AS section, e.extname, e.extversion, n.nspname AS extension_schema
          FROM pg_extension e
          JOIN pg_namespace n ON n.oid = e.extnamespace
          ORDER BY e.extname;
          SELECT 'MIGRATION_TABLE' AS section, to_regclass('public.schema_migrations') AS table_name;
          SELECT 'PUBLIC_TABLE_COUNTS' AS section,
                 count(*) AS application_tables,
                 count(*) FILTER (WHERE c.relrowsecurity) AS rls_enabled,
                 count(*) FILTER (WHERE c.relforcerowsecurity) AS rls_forced
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','p');
          ROLLBACK;
          SQL
          echo "Read-only inventory completed. No schema or data changes were made."
