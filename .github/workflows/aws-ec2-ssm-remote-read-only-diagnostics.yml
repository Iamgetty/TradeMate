name: AWS EC2 Read-Only SSM Remote Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ec2-ssm-remote-read-only-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Run fixed read-only diagnostics on the staging EC2 instance
    runs-on: ubuntu-latest
    environment: aws-ssm-diagnostics
    timeout-minutes: 8
    steps:
      - name: Configure the dedicated AWS diagnostics role through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_SSM_DIAGNOSTICS_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-ssm-readonly-diagnostics

      - name: Verify the assumed AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "661406600284"
          echo "Authenticated to the expected AWS account."

      - name: Send the fixed read-only diagnostic script
        id: send
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ssm-parameters.json" <<'JSON'
          {
            "commands": [
              "set -eu",
              "echo '=== Host and operating system ==='",
              "hostnamectl --static 2>/dev/null || hostname",
              "grep -E '^(NAME|VERSION|PRETTY_NAME)=' /etc/os-release",
              "uname -r",
              "echo '=== Uptime and resource capacity ==='",
              "uptime",
              "nproc",
              "free -h",
              "df -h /",
              "echo '=== Runtime availability (versions only) ==='",
              "node --version 2>/dev/null || echo 'Node.js not installed'",
              "npm --version 2>/dev/null || echo 'npm not installed'",
              "cloudflared --version 2>/dev/null || echo 'cloudflared not installed'",
              "echo '=== Relevant service states ==='",
              "systemctl is-active amazon-ssm-agent 2>/dev/null || true",
              "systemctl is-active trademate-api 2>/dev/null || true",
              "systemctl is-active exchange-feed 2>/dev/null || true",
              "systemctl is-active cloudflared 2>/dev/null || true",
              "echo '=== Listening TCP ports (no process arguments) ==='",
              "ss -lnt 2>/dev/null || true",
              "echo '=== End of read-only diagnostics ==='"
            ]
          }
          JSON
          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids i-035b1f1d00052c77e \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --timeout-seconds 120 \
            --comment "TradeMate fixed read-only EC2 diagnostics" \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted the fixed diagnostic script to the single approved instance."

      - name: Wait for completion and print diagnostic output
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e; then
            echo "SSM command did not reach a successful terminal state; retrieving available output."
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e \
            --plugin-name aws:runShellScript \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e \
            --query Status \
            --output text)"
          test "$STATUS" = "Success"

      - name: Confirm the safety boundary
        if: always()
        run: |
          echo "This workflow targets only i-035b1f1d00052c77e and runs a fixed read-only script."
          echo "It does not install software, edit files, restart services, open sessions, change IAM, or provision infrastructure."
