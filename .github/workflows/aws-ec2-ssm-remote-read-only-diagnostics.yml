name: AWS EC2 Read-Only SSM Remote Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ec2-ssm-remote-read-only-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Run fixed read-only diagnostics on the staging EC2 instance
    runs-on: ubuntu-latest
    environment: aws-ssm-diagnostics
    timeout-minutes: 8
    steps:
      - name: Configure the dedicated AWS diagnostics role through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_SSM_DIAGNOSTICS_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-ssm-readonly-diagnostics

      - name: Verify the assumed AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "661406600284"
          echo "Authenticated to the expected AWS account."

      - name: Send the fixed read-only diagnostic document
        id: send
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command \
            --document-name TradeMate-ReadOnly-EC2-Diagnostics \
            --document-version 1 \
            --instance-ids i-035b1f1d00052c77e \
            --timeout-seconds 120 \
            --comment "TradeMate fixed read-only EC2 diagnostics" \
            --query 'Command.CommandId' \
            --output text)"
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted the fixed, parameter-free SSM diagnostic document to the single approved instance."

      - name: Wait for completion and print diagnostic output
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          STATUS="Pending"
          remaining=36
          while [ "$remaining" -gt 0 ]; do
            remaining=$((remaining - 1))
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-035b1f1d00052c77e \
              --plugin-name collectReadOnlyDiagnostics \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e \
            --plugin-name collectReadOnlyDiagnostics \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e \
            --plugin-name collectReadOnlyDiagnostics \
            --query Status \
            --output text)"
          test "$STATUS" = "Success"

      - name: Confirm the safety boundary
        if: always()
        run: |
          echo "This workflow targets only i-035b1f1d00052c77e and runs a fixed, parameter-free read-only SSM document."
          echo "The IAM role cannot submit arbitrary shell commands because it is restricted to the fixed custom SSM document. The document does not accept parameters. This workflow does not install software, edit files, restart services, open sessions, change IAM, or provision infrastructure."
