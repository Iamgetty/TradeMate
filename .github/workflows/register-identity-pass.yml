name: Register identity-pass module (one-off)

on:
  push:
    branches:
      - feat/identity-pass-redesign
    paths:
      - '.github/workflows/register-identity-pass.yml'

permissions:
  contents: write

concurrency:
  group: register-identity-pass
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/identity-pass-redesign
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Register module in the runtime loader
        run: node .github/patches/register-identity-pass.js TradeMate-main/apps/web/app/app/TradeMateRuntime.tsx
      - name: Syntax check the module
        run: node --check TradeMate-main/apps/web/public/tm/identity-pass.js
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Load the identity-pass module after app.js'
          git push origin HEAD:feat/identity-pass-redesign
