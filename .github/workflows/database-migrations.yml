name: Database migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TradeMate-main/apps/api/database/migrations/**'
      - 'TradeMate-main/apps/api/scripts/migrate.js'
      - 'TradeMate-main/apps/api/package.json'
      - 'TradeMate-main/apps/api/package-lock.json'
      - '.github/workflows/database-migrations.yml'

permissions:
  contents: read

concurrency:
  group: trademate-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.TRADEMATE_MIGRATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.TRADEMATE_DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify database secret is configured
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ] && [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure TRADEMATE_MIGRATION_DATABASE_URL or the temporary TRADEMATE_DATABASE_URL fallback."
            exit 1
          fi

      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install

      - name: Run database migrations
        working-directory: TradeMate-main/apps/api
        run: npm run db:migrate
