name: Database migrations

on:
  # Deliberately manual until a separately approved migration/release
  # orchestrator proves credential isolation and exact-artifact promotion.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trademate-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure required reviewers and the migration-only secret in this
    # GitHub Environment before enabling any production use.
    environment:
      name: production-migrations
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.TRADEMATE_MIGRATION_DATABASE_URL }}
      RLS_CONTEXT_HMAC_KEY: ${{ secrets.TRADEMATE_RLS_CONTEXT_HMAC_KEY }}
      PGSSLMODE: require
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: Verify dedicated migration and RLS verifier secrets are configured
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Configure TRADEMATE_MIGRATION_DATABASE_URL as a protected, environment-scoped secret."
            exit 1
          fi
          if ! [[ "$RLS_CONTEXT_HMAC_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Configure TRADEMATE_RLS_CONTEXT_HMAC_KEY as a protected 32-byte hex secret matching the API verifier key."
            exit 1
          fi

      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund

      - name: Run database migrations
        working-directory: TradeMate-main/apps/api
        run: npm run db:migrate
