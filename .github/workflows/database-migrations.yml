name: Database migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TradeMate-main/apps/api/database/migrations/**'
      - 'TradeMate-main/apps/api/scripts/migrate.js'
      - 'TradeMate-main/apps/api/package.json'
      - 'TradeMate-main/apps/api/package-lock.json'
      - '.github/workflows/database-migrations.yml'

permissions:
  contents: read

concurrency:
  group: trademate-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TradeMate-main/apps/api/package-lock.json

      - name: Verify database secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is missing or empty."
            exit 1
          fi

      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci

      - name: Run database migrations
        working-directory: TradeMate-main/apps/api
        run: npm run db:migrate
