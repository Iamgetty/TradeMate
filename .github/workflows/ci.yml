name: TradeMate CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  database:
    name: Database migration integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trademate_test
          POSTGRES_DB: trademate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trademate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Apply all database migrations to a clean PostgreSQL database
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: npm run db:migrate

  web:
    name: Web build and runtime syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate TradeMate runtime JavaScript
        run: node --check TradeMate-main/apps/web/public/tm/app.js
      - name: Install web dependencies
        working-directory: TradeMate-main/apps/web
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: TradeMate-main/apps/web
        run: npm run build

  api:
    name: API TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Build API
        working-directory: TradeMate-main/apps/api
        run: npm run build
