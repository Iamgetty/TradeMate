name: TradeMate CI

# Keep only the newest validation run for a given pull request or branch.
concurrency:
  group: trademate-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  database:
    name: Database migration integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trademate_test
          POSTGRES_DB: trademate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trademate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Build API for database context integration tests
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Apply all database migrations to a clean PostgreSQL database
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: npm run db:migrate
      - name: Verify organization document permissions and rollback through HTTP endpoints
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-organization-documents.js
      - name: Verify two-party marketplace contract lifecycle and concurrency
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-marketplace-contracts.js
      - name: Verify authentication audit atomicity and rollback
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: node scripts/test-auth-audit.js
      - name: Verify Services and B2B draft authorization and audit rollback
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-marketplace-listings.js
      - name: Verify least-privilege PostgreSQL roles and grants
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-db-roles.js
      - name: Verify RLS owner isolation and FORCE RLS behaviour
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-pilot.js
      - name: Verify immutable audit-event history
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-audit-immutability.js
      - name: Verify transaction-local user identity and connection-pool isolation
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-database-context.js

  web:
    name: Web build and runtime syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Validate TradeMate runtime JavaScript
        run: node --check TradeMate-main/apps/web/public/tm/app.js
      - name: Verify connected account cache isolation
        run: node TradeMate-main/apps/web/scripts/test-account-isolation.js
      - name: Install web dependencies
        working-directory: TradeMate-main/apps/web
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: TradeMate-main/apps/web
        run: npm run build


  exchange-feed:
    name: Exchange feed and MT5 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install exchange-feed dependencies
        working-directory: TradeMate-main/exchange-feed
        run: npm install --no-audit --no-fund
      - name: Run exchange-feed and MT5 quote tests
        working-directory: TradeMate-main/exchange-feed
        run: npm test

  api:
    name: API TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Build API
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Run API security validation tests
        working-directory: TradeMate-main/apps/api
        run: npm run test:security


  container-images:
    name: AWS API and exchange-feed container builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API runtime image
        run: docker build --pull -f TradeMate-main/apps/api/Dockerfile -t trademate-api:ci .
      - name: Verify API image runs as non-root and includes migration assets
        run: |
          test "$(docker image inspect trademate-api:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint node trademate-api:ci -e "const fs=require('fs'); if(!fs.existsSync('scripts/migrate.js') || !fs.existsSync('database/migrations/001_initial_marketplace.sql')) process.exit(1)"
      - name: Build exchange-feed runtime image
        run: docker build --pull -f TradeMate-main/exchange-feed/Dockerfile -t trademate-exchange-feed:ci .
      - name: Verify exchange-feed image runs as non-root
        run: test "$(docker image inspect trademate-exchange-feed:ci --format '{{.Config.User}}')" = "node"

  security:
    name: Security scanning (SAST, SCA and secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: API dependency audit
        working-directory: TradeMate-main/apps/api
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Web dependency audit
        working-directory: TradeMate-main/apps/web
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Exchange feed dependency audit
        working-directory: TradeMate-main/exchange-feed
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0

      - name: Static application security testing
        run: semgrep scan --config p/default --error --timeout 15 --timeout-threshold 10 TradeMate-main/apps/api/src TradeMate-main/apps/api/scripts TradeMate-main/apps/api/database/security TradeMate-main/apps/web

      - name: Fetch pull request base branch for secret scanning
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" || true

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-e2e:
    name: Browser app-shell smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install web and browser-test dependencies
        working-directory: TradeMate-main/apps/web
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: TradeMate-main/apps/web
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke tests
        working-directory: TradeMate-main/apps/web
        env:
          CI: true
        run: npm run test:e2e
