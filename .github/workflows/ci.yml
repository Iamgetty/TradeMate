name: TradeMate CI

# Keep only the newest validation run for a given pull request or branch.
concurrency:
  group: trademate-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  database:
    name: Database migration integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trademate_test
          POSTGRES_DB: trademate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trademate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Build API for database context integration tests
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Apply all database migrations to a clean PostgreSQL database
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: npm run db:migrate
      - name: Verify organization document permissions and rollback through HTTP endpoints
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-organization-documents.js
      - name: Verify two-party marketplace contract lifecycle and concurrency
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-marketplace-contracts.js
      - name: Verify authentication audit atomicity and rollback
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: node scripts/test-auth-audit.js
      - name: Verify Services and B2B draft authorization and audit rollback
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-marketplace-listings.js
      - name: Verify least-privilege PostgreSQL roles and grants
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-db-roles.js
      - name: Verify RLS owner isolation and FORCE RLS behaviour
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-pilot.js
      - name: Verify immutable audit-event history
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-audit-immutability.js
      - name: Verify transaction-local user identity and connection-pool isolation
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-database-context.js

  web:
    name: Web build and runtime syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Validate TradeMate runtime JavaScript
        run: node --check TradeMate-main/apps/web/public/tm/app.js
      - name: Verify connected account cache isolation
        run: node TradeMate-main/apps/web/scripts/test-account-isolation.js
      - name: Install web dependencies
        working-directory: TradeMate-main/apps/web
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: TradeMate-main/apps/web
        run: npm run build


  exchange-feed:
    name: Exchange feed and MT5 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install exchange-feed dependencies
        working-directory: TradeMate-main/exchange-feed
        run: npm install --no-audit --no-fund
      - name: Run exchange-feed and MT5 quote tests
        working-directory: TradeMate-main/exchange-feed
        run: npm test

  api:
    name: API TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Build API
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Run API security validation tests
        working-directory: TradeMate-main/apps/api
        run: npm run test:security

  security:
    name: Security scanning (SAST, SCA and secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: API dependency audit
        working-directory: TradeMate-main/apps/api
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Web dependency audit
        working-directory: TradeMate-main/apps/web
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Exchange feed dependency audit
        working-directory: TradeMate-main/exchange-feed
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0

      - name: Static application security testing
        run: semgrep scan --config p/default --error --timeout 15 --timeout-threshold 10 TradeMate-main/apps/api/src TradeMate-main/apps/api/scripts TradeMate-main/apps/api/database/security TradeMate-main/apps/web

      - name: Fetch pull request base branch for secret scanning
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" || true

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-e2e:
    name: Browser app-shell smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install web and browser-test dependencies
        working-directory: TradeMate-main/apps/web
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: TradeMate-main/apps/web
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke tests
        working-directory: TradeMate-main/apps/web
        env:
          CI: true
        run: npm run test:e2e

  cloudflare-workers:
    name: Isolated Cloudflare Workers frontend build and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Create disposable frontend copy
        run: |
          mkdir -p "$RUNNER_TEMP/trademate-web"
          cp -a TradeMate-main/apps/web/. "$RUNNER_TEMP/trademate-web/"
      - name: Initialize Cloudflare Workers adapter in disposable copy
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          npx --yes vinext@1.4.0 init --platform=cloudflare \
            --cdn-cache=none \
            --data-cache=none \
            --image-optimization=none \
            --no-prerender
      # The source app's standalone output is for the Node.js deployment target.
      # vinext/Workers writes its own .cloudflare output; leaving Next's standalone
      # setting enabled makes vinext's finalizer incorrectly look for ./dist.
      # Remove it only from the disposable CI copy, never from the tracked app.
      - name: Disable Node standalone output in disposable adapter copy
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("next.config.mjs")
          source = path.read_text()
          setting = "  output: 'standalone',\n"
          if source.count(setting) != 1:
              raise SystemExit("Expected exactly one standalone output setting in next.config.mjs")
          path.write_text(source.replace(setting, ""))
          PY
      - name: Install isolated adapter dependencies
        working-directory: ${{ runner.temp }}/trademate-web
        run: npm install --no-audit --no-fund
      - name: Build Cloudflare Workers output
        working-directory: ${{ runner.temp }}/trademate-web
        run: npm run build:vinext
      - name: Smoke-test local Workers runtime and API proxy guard
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          set -euo pipefail
          # Exercise the built Worker preview, not Vite's development server.
          npm run start:vinext -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vinext-runtime.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ -o "$RUNNER_TEMP/vinext-home.html"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/vinext-runtime.log"
            echo "Workers local runtime did not become ready" >&2
            exit 1
          fi
          if ! grep -Eiq '<html([[:space:]>])' "$RUNNER_TEMP/vinext-home.html"; then
            echo "Homepage response did not contain an HTML document marker." >&2
            head -c 1000 "$RUNNER_TEMP/vinext-home.html" >&2 || true
            cat "$RUNNER_TEMP/vinext-runtime.log" >&2
            exit 1
          fi
          proxy_status=$(curl --silent --output "$RUNNER_TEMP/vinext-proxy.txt" --write-out '%{http_code}' http://127.0.0.1:4173/api/cloudflare-validation-probe)
          if [ "$proxy_status" != "503" ]; then
            echo "Expected API proxy HTTP 503 without TRADEMATE_API_ORIGIN; received HTTP $proxy_status." >&2
            cat "$RUNNER_TEMP/vinext-proxy.txt" >&2 || true
            cat "$RUNNER_TEMP/vinext-runtime.log" >&2
            exit 1
          fi
          echo "Homepage rendered and unconfigured API proxy correctly returned HTTP 503."
