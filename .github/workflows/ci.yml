name: TradeMate CI

# Keep only the newest validation run for a given pull request or branch.
concurrency:
  group: trademate-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/sports-transfer-private-profile-api
      - feat/sports-transfer-organization-memberships
      - feat/sports-transfer-representative-mandates
      - feat/sports-transfer-opportunity-drafts
      - feat/sports-transfer-external-player-discovery-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  database:
    name: Database migration integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trademate_test
          POSTGRES_DB: trademate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trademate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund
      - name: Prepare disposable pgcrypto and HMAC test key
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: |
          set -euo pipefail
          RLS_CONTEXT_HMAC_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$RLS_CONTEXT_HMAC_KEY"
          echo "RLS_CONTEXT_HMAC_KEY=$RLS_CONTEXT_HMAC_KEY" >> "$GITHUB_ENV"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;'
      - name: Build API for database context integration tests
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Apply all database migrations to a clean PostgreSQL database
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: npm run db:migrate
      - name: Verify routine migrations cannot rotate the RLS HMAC verifier key
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-migration-hmac-key-immutability.js
      - name: Verify Sports Transfer identity, consent, mandate and guardian constraints
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-sports-transfer-identity.js
      - name: Verify Sports Transfer private profile and consent HTTP authorization
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-sports-transfer-private-api.js
      - name: Verify Sports Transfer representative mandate HTTP authorization
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-sports-transfer-mandates-api.js
      - name: Verify Sports Transfer organization membership HTTP authorization
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-sports-transfer-organization-api.js
      - name: Verify private Sports Transfer opportunity draft API authorization
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-sports-transfer-opportunities-api.js
      - name: Verify source-governed Sports Transfer external player discovery schema
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-sports-transfer-external-discovery.js
      - name: Verify organization document permissions and rollback through HTTP endpoints
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-organization-documents.js
      - name: Verify two-party marketplace contract lifecycle and concurrency
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-marketplace-contracts.js
      - name: Verify two-party P2P lifecycle, privacy and concurrency
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-p2p-lifecycle.js
      - name: Verify authentication audit atomicity and rollback
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-auth-audit.js
      - name: Verify all ten contract divisions across member roles, moderation and audit rollback
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-marketplace-listings.js
      - name: Verify least-privilege PostgreSQL roles and grants
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-db-roles.js
      - name: Execute account-deletion transaction as the restricted worker role
        working-directory: TradeMate-main/apps/api
        env:
          ACCOUNT_DELETION_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-account-deletion-worker.js
      - name: Test RLS pilot connection-target guard
        working-directory: TradeMate-main/apps/api
        run: node --test test/test-rls-pilot-safety.test.cjs
      - name: Verify RLS owner isolation and FORCE RLS behaviour
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-pilot.js
      - name: Confirm runtime-login RLS identity spoofing limitation
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-runtime-login.js
      - name: Verify immutable audit-event history
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-audit-immutability.js
      - name: Verify transaction-local user identity and connection-pool isolation
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-database-context.js

  web:
    name: Web build and runtime syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Validate TradeMate runtime JavaScript
        run: node --check TradeMate-main/apps/web/public/tm/app.js
      - name: Verify connected account cache isolation
        run: node TradeMate-main/apps/web/scripts/test-account-isolation.js
      - name: Test market metadata refresh lifecycle
        run: node --test TradeMate-main/apps/web/scripts/market-metadata.test.cjs
      - name: Install web dependencies
        working-directory: TradeMate-main/apps/web
        run: npm ci --no-audit --no-fund
      - name: Build web application
        working-directory: TradeMate-main/apps/web
        run: npm run build


  exchange-feed:
    name: Exchange feed and MT5 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install exchange-feed dependencies
        working-directory: TradeMate-main/exchange-feed
        run: npm ci --no-audit --no-fund
      - name: Run exchange-feed and MT5 quote tests
        working-directory: TradeMate-main/exchange-feed
        run: npm test

  api:
    name: API TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund
      - name: Lint API TypeScript source
        working-directory: TradeMate-main/apps/api
        run: npm run lint
      - name: Build API
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Run API security validation tests
        working-directory: TradeMate-main/apps/api
        timeout-minutes: 12
        run: |
          for test_file in test/*.test.cjs; do
            echo "::group::API security test file: $test_file"
            if timeout 90s node --test "$test_file"; then
              echo "::endgroup::"
            else
              result=$?
              echo "::endgroup::"
              exit "$result"
            fi
          done


  container-images:
    name: AWS API and exchange-feed container builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API runtime image
        run: docker build --pull -f TradeMate-main/apps/api/Dockerfile -t trademate-api:ci .
      - name: Verify API image runs as non-root and includes migration assets
        run: |
          test "$(docker image inspect trademate-api:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint node trademate-api:ci -e "const fs=require('fs'); if(!fs.existsSync('scripts/migrate.js') || !fs.existsSync('database/migrations/001_initial_marketplace.sql')) process.exit(1)"
      - name: Build exchange-feed runtime image
        run: docker build --pull -f TradeMate-main/exchange-feed/Dockerfile -t trademate-exchange-feed:ci .
      - name: Verify exchange-feed image runs as non-root
        run: test "$(docker image inspect trademate-exchange-feed:ci --format '{{.Config.User}}')" = "node"

  security:
    name: Security scanning (SAST, SCA and secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: API dependency audit
        working-directory: TradeMate-main/apps/api
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: Web dependency audit
        working-directory: TradeMate-main/apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: Exchange feed dependency audit
        working-directory: TradeMate-main/exchange-feed
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0

      - name: Static application security testing
        run: semgrep scan --config p/default --error --timeout 15 --timeout-threshold 10 TradeMate-main/apps/api/src TradeMate-main/apps/api/scripts TradeMate-main/apps/api/database/security TradeMate-main/apps/web

      - name: Fetch pull request base branch for secret scanning
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" || true

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-e2e:
    name: Browser app-shell and live API acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trademate_test
          POSTGRES_DB: trademate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trademate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund
      - name: Prepare disposable pgcrypto and HMAC test key
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: |
          set -euo pipefail
          RLS_CONTEXT_HMAC_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$RLS_CONTEXT_HMAC_KEY"
          echo "RLS_CONTEXT_HMAC_KEY=$RLS_CONTEXT_HMAC_KEY" >> "$GITHUB_ENV"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;'
      - name: Build API for live browser acceptance
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Apply migrations to disposable browser-test database
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: npm run db:migrate
      - name: Seed independent browser accounts and a proposed contract
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/create-live-browser-contract-fixture.js "$RUNNER_TEMP/trademate-e2e-fixture.json"
      - name: Start API against disposable PostgreSQL
        working-directory: TradeMate-main/apps/api
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: |
          TOTP_ENCRYPTION_KEY="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          export TOTP_ENCRYPTION_KEY
          nohup npm run start:prod > "$RUNNER_TEMP/trademate-api.log" 2>&1 &
          for _ in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4000/api/health >/dev/null; then
              echo "Disposable API is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/trademate-api.log"
          exit 1
      - name: Install web and browser-test dependencies
        working-directory: TradeMate-main/apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: TradeMate-main/apps/web
        run: npx playwright install --with-deps chromium
      - name: Run mocked smoke tests and live two-account browser acceptance
        working-directory: TradeMate-main/apps/web
        env:
          CI: true
          TRADEMATE_API_ORIGIN: http://127.0.0.1:4000
          TRADEMATE_E2E_FIXTURE: ${{ runner.temp }}/trademate-e2e-fixture.json
        run: |
          npm run test:e2e || {
            echo '--- Disposable API log tail ---'
            tail -n 120 "$RUNNER_TEMP/trademate-api.log"
            exit 1
          }

  cloudflare-workers:
    name: Isolated Cloudflare Workers frontend build and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Create disposable frontend copy
        run: |
          mkdir -p "$RUNNER_TEMP/trademate-web"
          cp -a TradeMate-main/apps/web/. "$RUNNER_TEMP/trademate-web/"
      # npm currently advertises an unpublished webpack 5.113.0 tarball in peer resolution.
      # Pin the disposable adapter install to the latest published compatible webpack release.
      # This affects only the CI copy; the Node/Next.js application manifest is unchanged.
      - name: Stabilize webpack peer resolution in disposable adapter copy
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.overrides ??= {};
          if (manifest.overrides.webpack && manifest.overrides.webpack !== '5.112.2') {
            throw new Error('Unexpected existing webpack override; refusing to replace it.');
          }
          manifest.overrides.webpack = '5.112.2';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Build deployable Cloudflare Workers output using the shared staging script
        working-directory: ${{ runner.temp }}/trademate-web
        run: bash scripts/cloudflare-build.sh
      - name: Verify exactly one generated Cloudflare deployment manifest
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          manifests=$(find dist -type f \\( -name 'wrangler.json' -o -name 'wrangler.jsonc' \\) -print)
          test "$(printf '%s\\n' "$manifests" | sed '/^$/d' | wc -l)" -eq 1
      - name: Smoke-test local Workers runtime and API proxy guard
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          set -euo pipefail
          # Exercise the built Worker preview, not Vite's development server.
          npm run start:vinext -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vinext-runtime.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --show-error --location --max-redirs 5 --fail http://127.0.0.1:4173/ -o "$RUNNER_TEMP/vinext-home.html"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/vinext-runtime.log"
            echo "Workers local runtime did not become ready" >&2
            exit 1
          fi
          if ! grep -Eiq '<html([[:space:]>])' "$RUNNER_TEMP/vinext-home.html"; then
            echo "Homepage response did not contain an HTML document marker." >&2
            head -c 1000 "$RUNNER_TEMP/vinext-home.html" >&2 || true
            cat "$RUNNER_TEMP/vinext-runtime.log" >&2
            exit 1
          fi
          proxy_status=$(curl --silent --output "$RUNNER_TEMP/vinext-proxy.txt" --write-out '%{http_code}' http://127.0.0.1:4173/api/cloudflare-validation-probe)
          if [ "$proxy_status" != "503" ]; then
            echo "Expected API proxy HTTP 503 without TRADEMATE_API_ORIGIN; received HTTP $proxy_status." >&2
            cat "$RUNNER_TEMP/vinext-proxy.txt" >&2 || true
            cat "$RUNNER_TEMP/vinext-runtime.log" >&2
            exit 1
          fi
          echo "Homepage rendered and unconfigured API proxy correctly returned HTTP 503."