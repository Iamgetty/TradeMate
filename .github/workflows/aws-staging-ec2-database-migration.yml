name: AWS Staging Database Migration on EC2

on:
  workflow_run:
    workflows:
      - TradeMate CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: trademate-aws-staging-ec2-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed migrations to AWS staging RDS
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - aws-staging
    timeout-minutes: 20
    environment:
      name: aws-staging-image-publish
    env:
      AWS_STAGING_PUBLISH_ROLE_ARN: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
      AWS_STAGING_ACCOUNT_ID: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
    steps:
      - name: Validate exact main release and successful checks
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          if len(source_sha) != 40 or any(c not in "0123456789abcdef" for c in source_sha):
              raise SystemExit("TradeMate CI did not provide a valid main commit SHA.")

          def github_api(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repository + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          current_main = github_api("/branches/main")["commit"]["sha"]
          if source_sha != current_main:
              raise SystemExit("main advanced while this migration was waiting; a fresh CI run on the current main SHA must complete before migration.")

          checks = github_api("/commits/" + source_sha + "/check-runs?per_page=100")["check_runs"]
          required = [
              "Browser app-shell and live API acceptance tests",
              "AWS API and exchange-feed container builds",
              "Exchange feed and MT5 tests",
              "Database migration integration",
              "Security scanning (SAST, SCA and secrets)",
              "API TypeScript build",
              "Web build and runtime syntax",
              "Isolated Cloudflare Workers frontend build and runtime",
              "PostgreSQL 18 role and RLS checks",
              "PostgreSQL 16 role and RLS checks",
          ]
          for name in required:
              matching = [item for item in checks if item.get("name") == name]
              matching.sort(key=lambda item: item.get("completed_at") or item.get("started_at") or "")
              conclusion = matching[-1].get("conclusion") if matching else None
              if conclusion != "success":
                  raise SystemExit("Required check '" + name + "' is not successful for " + source_sha + " (conclusion: " + str(conclusion) + ").")

          print("Exact main SHA and all required CI checks verified.")
          PY
          if ! systemctl is-active --quiet trademate-api.service; then
            echo "::error::The AWS staging API service is not active; refusing to migrate."
            exit 1
          fi

      - name: Check out the exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Validate the approved staging role
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AWS_STAGING_PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ || "$AWS_STAGING_ACCOUNT_ID" != "661406600284" ]]; then
            echo "::error::The approved TradeMate staging AWS role or account is not configured."
            exit 1
          fi

      - name: Assume the restricted AWS staging role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-staging-migration

      - name: Select the pinned Node.js 24 runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_HOME="$HOME/.local/opt/node-v24.22.1"
          if [[ ! -x "$NODE_HOME/bin/node" || "$("$NODE_HOME/bin/node" --version)" != "v24.22.1" ]]; then
            echo "::error::The pinned Node.js 24.22.1 runtime is not installed on the staging runner."
            exit 1
          fi
          echo "$NODE_HOME/bin" >> "$GITHUB_PATH"

      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund

      - name: Apply migrations using the dedicated staging migrator credential
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json
          import os
          import subprocess

          secret_result = subprocess.run(
              ["aws", "secretsmanager", "get-secret-value", "--secret-id", "trademate/staging/api",
               "--query", "SecretString", "--output", "text"],
              check=True, capture_output=True, text=True,
          )
          values = json.loads(secret_result.stdout)
          migration_url = values.get("MIGRATION_DATABASE_URL", "")
          verifier_key = values.get("RLS_CONTEXT_HMAC_KEY", "")
          if not isinstance(migration_url, str) or not migration_url.startswith(("postgres://", "postgresql://")):
              raise SystemExit("The dedicated staging MIGRATION_DATABASE_URL is missing or invalid.")
          if not isinstance(verifier_key, str) or len(verifier_key) != 64 or any(c not in "0123456789abcdefABCDEF" for c in verifier_key):
              raise SystemExit("The staging RLS_CONTEXT_HMAC_KEY is missing or invalid.")
          ca_bundle = "/opt/actions-runner/rds-global-bundle.pem"
          if not os.path.isfile(ca_bundle):
              raise SystemExit("The staging runner's approved RDS CA bundle is missing.")
          env = os.environ.copy()
          env.update({
              "NODE_ENV": "production",
              "MIGRATION_DATABASE_URL": migration_url,
              "RLS_CONTEXT_HMAC_KEY": verifier_key,
              "PGSSLMODE": "require",
              "NODE_EXTRA_CA_CERTS": ca_bundle,
          })
          subprocess.run(["npm", "run", "db:migrate"], cwd="TradeMate-main/apps/api", env=env, check=True)
          print("AWS staging database migrations completed successfully. Secret values were not printed.")
          PY
