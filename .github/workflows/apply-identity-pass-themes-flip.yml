name: Apply identity pass themes and flip fix (one-off)

on:
  push:
    branches:
      - fix/identity-pass-themes-flip
    paths:
      - '.github/workflows/apply-identity-pass-themes-flip.yml'

permissions:
  contents: write

concurrency:
  group: apply-identity-pass-themes-flip
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/identity-pass-themes-flip
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Apply patch to the identity pass module
        run: node .github/patches/identity-pass-themes-flip.js TradeMate-main/apps/web/public/tm/identity-pass.js
      - name: Syntax check the module
        run: node --check TradeMate-main/apps/web/public/tm/identity-pass.js
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Identity pass: follow each theme, replace 3D flip, larger progress badge, align security bars'
          git push origin HEAD:fix/identity-pass-themes-flip
