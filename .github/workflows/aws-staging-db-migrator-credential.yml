name: AWS Staging Migrator Credential Setup

on:
  workflow_dispatch:
    inputs:
      confirm_credential_setup:
        description: Create/rotate the dedicated staging migrator credential and update MIGRATION_DATABASE_URL.
        type: choice
        required: true
        options:
          - "no"
          - "yes"
      source_sha:
        description: Full 40-character main commit SHA that passed the required CI checks.
        type: string
        required: true

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: trademate-aws-staging-migrator-credential
  cancel-in-progress: false

jobs:
  configure:
    name: Configure and verify staging migrator credential
    runs-on:
      - self-hosted
      - Linux
      - X64
      - aws-staging
    timeout-minutes: 15
    environment:
      name: aws-staging-image-publish
    env:
      AWS_STAGING_PUBLISH_ROLE_ARN: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
      AWS_STAGING_ACCOUNT_ID: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
    steps:
      - name: Validate exact main release and successful checks
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM_CREDENTIAL_SETUP: ${{ inputs.confirm_credential_setup }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          if os.environ["CONFIRM_CREDENTIAL_SETUP"] != "yes":
              raise SystemExit("Credential setup confirmation was not yes; refusing to continue.")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("Staging migrator credentials may only be configured from main.")
          source_sha = os.environ["SOURCE_SHA"]
          if len(source_sha) != 40 or any(c not in "0123456789abcdef" for c in source_sha):
              raise SystemExit("A valid full main commit SHA is required.")

          def github_api(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          if github_api("/branches/main")["commit"]["sha"] != source_sha:
              raise SystemExit("main advanced; rerun CI and use the current main SHA.")

          checks = github_api("/commits/" + source_sha + "/check-runs?per_page=100")["check_runs"]
          required = [
              "Browser app-shell and live API acceptance tests",
              "AWS API and exchange-feed container builds",
              "Exchange feed and MT5 tests",
              "Database migration integration",
              "Security scanning (SAST, SCA and secrets)",
              "API TypeScript build",
              "Web build and runtime syntax",
              "Isolated Cloudflare Workers frontend build and runtime",
              "PostgreSQL 18 role and RLS checks",
              "PostgreSQL 16 role and RLS checks",
          ]
          for name in required:
              matching = [item for item in checks if item.get("name") == name]
              matching.sort(key=lambda item: item.get("completed_at") or item.get("started_at") or "")
              conclusion = matching[-1].get("conclusion") if matching else None
              if conclusion != "success":
                  raise SystemExit("Required check '" + name + "' is not successful (conclusion: " + str(conclusion) + ").")
          print("Current main SHA and all required checks verified.")
          PY

      - name: Validate the approved staging AWS role
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AWS_STAGING_PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ || "$AWS_STAGING_ACCOUNT_ID" != "661406600284" ]]; then
            echo "::error::The approved TradeMate staging AWS role or account is not configured."
            exit 1
          fi

      - name: Assume the restricted AWS staging role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-staging-migrator-credential

      - name: Check out the exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Set migrator password, update only MIGRATION_DATABASE_URL, and verify
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          import tempfile
          from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit

          region = "eu-north-1"
          secret_name = "trademate/staging/api"
          admin_secret_name = "trademate/staging/db-admin"
          db_host = "trademate-db.cnoaequa8k6z.eu-north-1.rds.amazonaws.com"
          db_name = "trademate"
          ca_bundle = "/opt/actions-runner/rds-global-bundle.pem"

          def aws_secret(secret_id):
              result = subprocess.run(
                  ["aws", "secretsmanager", "get-secret-value", "--region", region,
                   "--secret-id", secret_id, "--query", "SecretString", "--output", "text"],
                  check=True, capture_output=True, text=True,
              )
              return json.loads(result.stdout)

          api_values = aws_secret(secret_name)
          admin_values = aws_secret(admin_secret_name)
          runtime_url = api_values.get("DATABASE_URL")
          admin_password = admin_values.get("trademate_db_password")
          if not isinstance(runtime_url, str) or not runtime_url:
              raise SystemExit("The staging DATABASE_URL is missing.")
          if not isinstance(admin_password, str) or not admin_password:
              raise SystemExit("The staging database administrator password is missing.")
          if not os.path.isfile(ca_bundle):
              raise SystemExit("The approved RDS CA bundle is missing from the staging runner.")

          parsed = urlsplit(runtime_url)
          if parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("The staging DATABASE_URL must use PostgreSQL.")
          if parsed.username != "trademate_app":
              raise SystemExit("DATABASE_URL is not using the expected restricted trademate_app role.")
          if parsed.hostname != db_host or parsed.port not in (None, 5432) or parsed.path != "/" + db_name:
              raise SystemExit("DATABASE_URL does not point to the approved staging RDS database.")
          if parsed.password is None:
              raise SystemExit("The staging DATABASE_URL is missing its password.")

          migrator_password = secrets.token_urlsafe(48)
          query = parse_qsl(parsed.query, keep_blank_values=True)
          if not any(key.lower() == "sslmode" for key, _ in query):
              query.append(("sslmode", "require"))
          netloc = quote("trademate_migrator", safe="") + ":" + quote(migrator_password, safe="") + "@" + db_host + ":5432"
          migration_url = urlunsplit((parsed.scheme, netloc, "/" + db_name, urlencode(query), ""))

          # Set the password through psql stdin; it is never placed in SQL arguments or logs.
          admin_env = os.environ.copy()
          admin_env.update({
              "PGPASSWORD": admin_password,
              "PGSSLMODE": "verify-full",
              "PGSSLROOTCERT": ca_bundle,
              "MIGRATOR_PASSWORD": migrator_password,
          })
          connection = [
              "/usr/bin/psql", "-X", "-v", "ON_ERROR_STOP=1",
              "-h", db_host, "-p", "5432", "-U", "trademate_admin", "-d", db_name,
          ]
          password_sql = "\\getenv migrator_password MIGRATOR_PASSWORD\nALTER ROLE trademate_migrator PASSWORD :'migrator_password';\n"
          subprocess.run(connection, input=password_sql, env=admin_env, text=True, check=True,
                         stdout=subprocess.PIPE, stderr=subprocess.PIPE)

          # Preserve every existing secret field and leave DATABASE_URL byte-for-byte unchanged.
          if api_values.get("DATABASE_URL") != runtime_url:
              raise SystemExit("DATABASE_URL changed unexpectedly; refusing to update the API secret.")
          api_values["MIGRATION_DATABASE_URL"] = migration_url
          temp_path = None
          try:
              with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", prefix="trademate-staging-secret-", delete=False) as handle:
                  temp_path = handle.name
                  os.chmod(temp_path, 0o600)
                  json.dump(api_values, handle, separators=(",", ":"))
              subprocess.run(
                  ["aws", "secretsmanager", "put-secret-value", "--region", region,
                   "--secret-id", secret_name, "--secret-string", "file://" + temp_path],
                  check=True, capture_output=True, text=True,
              )
          finally:
              if temp_path and os.path.exists(temp_path):
                  os.remove(temp_path)

          # Prove the newly stored credential can authenticate and has only the intended schema-create capability.
          migrator_env = os.environ.copy()
          migrator_env.update({
              "PGPASSWORD": migrator_password,
              "PGSSLMODE": "verify-full",
              "PGSSLROOTCERT": ca_bundle,
          })
          check = subprocess.run(
              ["/usr/bin/psql", "-X", "-A", "-t", "-v", "ON_ERROR_STOP=1",
               "-h", db_host, "-p", "5432", "-U", "trademate_migrator", "-d", db_name,
               "-c", "SELECT current_user || '|' || has_schema_privilege(current_user, 'public', 'CREATE')"],
              env=migrator_env, check=True, capture_output=True, text=True,
          )
          if check.stdout.strip() != "trademate_migrator|t":
              raise SystemExit("The migrator credential authenticated but failed its expected schema privilege assertion.")

          print("Dedicated staging migrator credential created and verified.")
          print("MIGRATION_DATABASE_URL updated; DATABASE_URL and all other secret fields preserved.")
          print("No migrations were run and no production resources were accessed.")
          PY
