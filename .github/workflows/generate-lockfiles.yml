
name: Generate and validate npm lockfiles

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-remediation-2026-11-18
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write

concurrency:
  group: trademate-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate and validate lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.ref == 'refs/heads/fix/audit-remediation-2026-11-18'

    steps:
      - name: Check out TradeMate
        uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-2026-11-18
          fetch-depth: 0

      - name: Install Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          check-latest: true
          cache: npm
          cache-dependency-path: |
            TradeMate-main/apps/api/package.json
            TradeMate-main/apps/web/package.json
            TradeMate-main/exchange-feed/package.json

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "
            const major = Number(process.versions.node.split('.')[0]);
            if (major !== 24) {
              throw new Error('Expected Node.js 24');
            }
          "

      - name: Generate and validate API lockfile
        working-directory: TradeMate-main/apps/api
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build --if-present

      - name: Generate and validate Web lockfile
        working-directory: TradeMate-main/apps/web
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build --if-present

      - name: Generate and validate Exchange Feed lockfile
        working-directory: TradeMate-main/exchange-feed
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build --if-present

      - name: Confirm lockfiles exist
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            TradeMate-main/apps/api/package-lock.json \
            TradeMate-main/apps/web/package-lock.json \
            TradeMate-main/exchange-feed/package-lock.json
          do
            test -s "$file"
            echo "Validated: $file"
          done

      - name: Check generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check

      - name: Commit validated lockfiles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            TradeMate-main/apps/api/package-lock.json \
            TradeMate-main/apps/web/package-lock.json \
            TradeMate-main/exchange-feed/package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git commit -m "build: add validated npm lockfiles"

          git push origin HEAD:fix/audit-remediation-2026-11-18
