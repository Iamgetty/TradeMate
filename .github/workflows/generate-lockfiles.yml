name: Generate and validate npm lockfiles

on:
  # This workflow is intentionally scoped to the lockfile-remediation branch.
  # Do not trigger it for unrelated dependency PRs: its job checks out and pushes
  # to that dedicated branch, so running it on other PRs only creates skipped jobs.
  push:
    branches:
      - fix/audit-remediation-2026-11-18
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trademate-lockfiles-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate and validate lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.ref == 'refs/heads/fix/audit-remediation-2026-11-18' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'fix/audit-remediation-2026-11-18' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/audit-remediation-2026-11-18
          fetch-depth: 0

      - name: Install Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          check-latest: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.22.1"
          node --version
          npm --version

      - name: Generate and validate API lockfile
        working-directory: TradeMate-main/apps/api
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build --if-present

      - name: Generate and validate Web lockfile
        working-directory: TradeMate-main/apps/web
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build --if-present

      - name: Generate and validate Exchange Feed lockfile
        working-directory: TradeMate-main/exchange-feed
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build --if-present

      - name: Confirm lockfiles and whitespace
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            TradeMate-main/apps/api/package-lock.json \
            TradeMate-main/apps/web/package-lock.json \
            TradeMate-main/exchange-feed/package-lock.json
          do
            test -s "$file"
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$file"
            echo "Valid JSON lockfile: $file"
          done
          git diff --check

      - name: Commit validated lockfiles to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            TradeMate-main/apps/api/package-lock.json \
            TradeMate-main/apps/web/package-lock.json \
            TradeMate-main/exchange-feed/package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git commit -m "build: add validated npm lockfiles"
          git push origin HEAD:fix/audit-remediation-2026-11-18
