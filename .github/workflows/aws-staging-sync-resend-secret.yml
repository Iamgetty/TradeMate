name: Sync Resend credentials to AWS Secrets Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/triggers/sync-resend-to-secrets-manager

permissions:
  contents: read
  id-token: write

concurrency:
  group: trademate-staging-resend-secret
  cancel-in-progress: false

jobs:
  sync:
    name: Store Resend credentials in the existing staging API secret
    runs-on: ubuntu-latest
    environment: aws-staging-image-publish
    timeout-minutes: 5
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - name: Validate inputs without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ -n "${RESEND_API_KEY:-}" ]] || { echo "::error::RESEND_API_KEY is missing"; exit 1; }
          [[ "$RESEND_API_KEY" =~ ^re_[A-Za-z0-9_-]+$ ]] || { echo "::error::RESEND_API_KEY format is invalid"; exit 1; }
          [[ -n "${RESEND_FROM_EMAIL:-}" ]] || { echo "::error::RESEND_FROM_EMAIL is missing"; exit 1; }
          [[ "$RESEND_FROM_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || { echo "::error::RESEND_FROM_EMAIL format is invalid"; exit 1; }

      - name: Assume the restricted AWS staging role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-resend-secret-sync

      - name: Merge Resend settings into the existing API secret
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          secret_id = "arn:aws:secretsmanager:eu-north-1:661406600284:secret:trademate/staging/api-1ADnn0"
          current = subprocess.run(
              ["aws", "secretsmanager", "get-secret-value", "--secret-id", secret_id,
               "--query", "SecretString", "--output", "text"],
              check=True, capture_output=True, text=True,
          ).stdout
          values = json.loads(current)
          if not isinstance(values, dict):
              raise SystemExit("Existing API secret is not a JSON object")
          values["RESEND_API_KEY"] = os.environ["RESEND_API_KEY"]
          values["RESEND_FROM_EMAIL"] = os.environ["RESEND_FROM_EMAIL"]
          fd, path = tempfile.mkstemp(prefix="trademate-resend-", suffix=".json")
          try:
              os.fchmod(fd, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  json.dump(values, handle)
              subprocess.run(
                  ["aws", "secretsmanager", "put-secret-value", "--secret-id", secret_id,
                   "--secret-string", "file://" + path],
                  check=True, capture_output=True, text=True,
              )
          finally:
              try:
                  os.unlink(path)
              except FileNotFoundError:
                  pass
          print("Resend settings stored in the existing staging API secret; values were not displayed.")
          PY
