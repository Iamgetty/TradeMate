name: Import Render data into AWS staging RDS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-render-data-to-aws.yml"
      - "TradeMate-main/apps/api/database/migrations/051_p2p_dispute_resolution_columns.sql"
      - "TradeMate-main/apps/api/database/migrations/052_render_view_reconciliation.sql"

permissions:
  contents: read

concurrency:
  group: trademate-render-to-aws-data-import
  cancel-in-progress: false

jobs:
  import:
    name: Safely transfer and verify Render PostgreSQL data
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Check out TradeMate repository
        uses: actions/checkout@v4
      - name: Transfer and verify database data
        shell: bash
        run: |
          set -euo pipefail
          set +x

          command -v aws >/dev/null
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          command -v psql >/dev/null
          command -v python3 >/dev/null

          WORK="$(mktemp -d "${RUNNER_TEMP:-/tmp}/trademate-db-import.XXXXXX")"
          chmod 700 "$WORK"
          trap 'rm -rf "$WORK"' EXIT

          aws secretsmanager get-secret-value \
            --secret-id "trademate/migration/render-source" \
            --query SecretString --output text > "$WORK/source-secret.json"
          aws secretsmanager get-secret-value \
            --secret-id "arn:aws:secretsmanager:eu-north-1:661406600284:secret:rds!db-886813df-a023-45a5-bef4-71fe0e81b8cf-nYlUfh" \
            --query SecretString --output text > "$WORK/target-secret.json"
          chmod 600 "$WORK"/*.json

          python3 - "$WORK" <<'PY'
          import json, pathlib, shlex, sys
          from urllib.parse import urlparse, unquote
          work = pathlib.Path(sys.argv[1])
          src = json.loads((work / "source-secret.json").read_text())
          raw = src.get("DATABASE_URL")
          if not raw:
              raise SystemExit("Source database URL is missing from its secret.")
          u = urlparse(raw)
          if not all([u.hostname, u.username, u.password, u.path.strip("/")]):
              raise SystemExit("Source database URL is incomplete.")
          target = json.loads((work / "target-secret.json").read_text())
          required = ("username", "password")
          if any(not target.get(k) for k in required):
              raise SystemExit("RDS managed secret is missing username or password.")
          def write_env(path, values):
              with path.open("w") as f:
                  for k, v in values.items():
                      f.write(f"{k}={shlex.quote(str(v))}\n")
              path.chmod(0o600)
          write_env(work / "source.env", {
              "PGHOST": u.hostname, "PGPORT": u.port or 5432,
              "PGUSER": unquote(u.username), "PGPASSWORD": unquote(u.password),
              "PGDATABASE": unquote(u.path.lstrip("/")), "PGSSLMODE": "require"
          })
          write_env(work / "target.env", {
              "PGHOST": "trademate-db.cnoaequa8k6z.eu-north-1.rds.amazonaws.com", "PGPORT": 5432,
              "PGUSER": target["username"], "PGPASSWORD": target["password"],
              "PGDATABASE": "trademate", "PGSSLMODE": "require"
          })
          PY
          rm -f "$WORK/source-secret.json" "$WORK/target-secret.json"

          table_counts() {
            psql -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          SELECT format(
            'SELECT %L || ''|'' || count(*)::text FROM %I.%I',
            tablename, schemaname, tablename
          )
          FROM pg_tables
          WHERE schemaname = 'public' AND tablename <> 'schema_migrations'
          ORDER BY tablename
          \gexec
          SQL
          }

          set -a
          source "$WORK/source.env"
          set +a
          pg_isready

          table_counts > "$WORK/source-counts.txt"
          test -s "$WORK/source-counts.txt"

          # Apply the tracked additive schema reconciliation before touching data.
          set -a
          source "$WORK/target.env"
          set +a
          pg_isready
          # Migration 051 also enforces Render's NOT NULL author identity after checking for null rows.
          psql -X -v ON_ERROR_STOP=1 -f "TradeMate-main/apps/api/database/migrations/051_p2p_dispute_resolution_columns.sql"
          psql -X -v ON_ERROR_STOP=1 -q -c "INSERT INTO public.schema_migrations (migration_name) VALUES ('051_p2p_dispute_resolution_columns.sql') ON CONFLICT (migration_name) DO NOTHING;"
          psql -X -v ON_ERROR_STOP=1 -f "TradeMate-main/apps/api/database/migrations/052_render_view_reconciliation.sql"
          psql -X -v ON_ERROR_STOP=1 -q -c "INSERT INTO public.schema_migrations (migration_name) VALUES ('052_render_view_reconciliation.sql') ON CONFLICT (migration_name) DO NOTHING;"

          # Fail closed unless every source column exists on AWS with the same PostgreSQL type and nullability.
          set -a
          source "$WORK/source.env"
          set +a
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT table_name,column_name,udt_name,COALESCE(character_maximum_length::text,''),COALESCE(numeric_precision::text,''),COALESCE(numeric_scale::text,''),is_nullable FROM information_schema.columns WHERE table_schema='public' ORDER BY table_name,column_name" > "$WORK/source-schema.txt"

          set -a
          source "$WORK/target.env"
          set +a
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT table_name,column_name,udt_name,COALESCE(character_maximum_length::text,''),COALESCE(numeric_precision::text,''),COALESCE(numeric_scale::text,''),is_nullable FROM information_schema.columns WHERE table_schema='public' ORDER BY table_name,column_name" > "$WORK/target-schema.txt"

          python3 - "$WORK/source-schema.txt" "$WORK/target-schema.txt" <<'PY'
          import pathlib, sys
          def load(path):
              rows = {}
              for line in pathlib.Path(path).read_text().splitlines():
                  fields = line.split("|")
                  if len(fields) != 7:
                      raise SystemExit("Could not parse database schema inventory.")
                  key = (fields[0], fields[1])
                  rows[key] = tuple(fields[2:])
              return rows
          source, target = load(sys.argv[1]), load(sys.argv[2])
          missing = sorted(set(source) - set(target))
          mismatched = sorted(k for k in set(source) & set(target) if source[k] != target[k])
          if missing or mismatched:
              for table, column in missing:
                  print(f"Missing AWS column: {table}.{column}")
              for table, column in mismatched:
                  print(f"Type/nullability mismatch: {table}.{column}")
                  print(f"  Render source: {source[(table, column)]}")
                  print(f"  AWS target:   {target[(table, column)]}")
              raise SystemExit("Source and AWS schemas are not compatible; import was not attempted.")
          print(f"Schema compatibility verified for {len(source)} source columns.")
          PY

          # Compare source constraints and indexes as well; this catches missing integrity rules.
          set -a
          source "$WORK/source.env"
          set +a
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT n.nspname,t.relname,c.conname,c.contype::text,pg_get_constraintdef(c.oid) FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='public' ORDER BY 1,2,3" > "$WORK/source-constraints.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT schemaname,tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='public' ORDER BY 1,2,3" > "$WORK/source-indexes.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT event_object_table,trigger_name,event_manipulation,action_timing,action_statement FROM information_schema.triggers WHERE trigger_schema='public' ORDER BY 1,2,3,4,5" > "$WORK/source-triggers.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT tablename,policyname,permissive,roles::text,cmd,COALESCE(qual,''),COALESCE(with_check,'') FROM pg_policies WHERE schemaname='public' ORDER BY 1,2" > "$WORK/source-policies.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT table_name,md5(view_definition) FROM information_schema.views WHERE table_schema='public' ORDER BY table_name" > "$WORK/source-views.txt"

          set -a
          source "$WORK/target.env"
          set +a
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT n.nspname,t.relname,c.conname,c.contype::text,pg_get_constraintdef(c.oid) FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='public' ORDER BY 1,2,3" > "$WORK/target-constraints.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT schemaname,tablename,indexname,indexdef FROM pg_indexes WHERE schemaname='public' ORDER BY 1,2,3" > "$WORK/target-indexes.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT event_object_table,trigger_name,event_manipulation,action_timing,action_statement FROM information_schema.triggers WHERE trigger_schema='public' ORDER BY 1,2,3,4,5" > "$WORK/target-triggers.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT tablename,policyname,permissive,roles::text,cmd,COALESCE(qual,''),COALESCE(with_check,'') FROM pg_policies WHERE schemaname='public' ORDER BY 1,2" > "$WORK/target-policies.txt"
          psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -c "SELECT table_name,md5(view_definition) FROM information_schema.views WHERE table_schema='public' ORDER BY table_name" > "$WORK/target-views.txt"

          python3 - "$WORK" <<'PY'
          import pathlib, sys
          work = pathlib.Path(sys.argv[1])
          failed = False
          for label in ("constraints", "indexes", "triggers", "policies", "views"):
              source = set((work / f"source-{label}.txt").read_text().splitlines())
              target = set((work / f"target-{label}.txt").read_text().splitlines())
              missing = sorted(source - target)
              if missing:
                  failed = True
                  print(f"AWS is missing {len(missing)} source {label}:")
                  for item in missing[:30]:
                      print(f"  {item}")
                      if label == "constraints" and "|feed_posts_author_user_id_fkey|" in item:
                          target_rows = sorted(
                              row for row in target
                              if "|feed_posts_author_user_id_fkey|" in row
                          )
                          for row in target_rows:
                              print(f"  AWS same-name constraint: {row}")
          if failed:
              raise SystemExit("Source and AWS integrity definitions differ; import was not attempted.")
          print("Source constraints and indexes are present on AWS.")
          PY

          table_counts > "$WORK/target-before-counts.txt"
          if awk -F'|' '$2 != 0 && $1 != "auth_rate_limits" { print "Target contains existing application rows in table " $1 > "/dev/stderr"; bad=1 } END { exit bad }' "$WORK/target-before-counts.txt"; then
            :
          else
            echo "::error::Refusing to import: AWS target is not empty. No target rows were changed."
            exit 1
          fi

          if [[ "$(cut -d'|' -f1 "$WORK/source-counts.txt" | sort)" != "$(cut -d'|' -f1 "$WORK/target-before-counts.txt" | sort)" ]]; then
            echo "::error::Source and target public table sets differ. No import attempted."
            exit 1
          fi

          set -a
          source "$WORK/source.env"
          set +a
          pg_dump --format=custom --data-only --no-owner --no-acl \
            --exclude-table=public.schema_migrations \
            --file "$WORK/render-data.dump"

          set -a
          source "$WORK/target.env"
          set +a
          # Rate-limit rows are transient staging traffic, not migrated user data.
          # Render has zero rows in this table; clear staging-only entries before restore.
          psql -X -v ON_ERROR_STOP=1 -q -c "TRUNCATE TABLE public.auth_rate_limits;"
          pg_restore --data-only --no-owner --no-acl --single-transaction \
            --exit-on-error --dbname="$PGDATABASE" "$WORK/render-data.dump"
          psql -X -v ON_ERROR_STOP=1 -q -c "ANALYZE;"

          table_counts > "$WORK/target-after-counts.txt"
          if ! diff -u "$WORK/source-counts.txt" "$WORK/target-after-counts.txt"; then
            echo "::error::Post-import row counts do not match Render. Keep Render online and investigate."
            exit 1
          fi

          echo "## Render to AWS staging data import"
          echo
          echo "- Import completed in a single transaction."
          echo "- Application table row counts match between source and target."
          echo "- The schema_migrations table was intentionally excluded; AWS schema migrations remain authoritative."
          echo "- Render source was not modified."
          echo "- No credentials or row contents are emitted."
          echo
          echo "Verified application tables: $(wc -l < "$WORK/source-counts.txt" | tr -d ' ')"
