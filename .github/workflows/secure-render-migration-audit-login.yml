name: Secure Render migration audit login

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trademate-render-migration-role-security
  cancel-in-progress: false

jobs:
  secure-audit-login:
    name: Remove inherited write access and verify read-only privileges
    runs-on: [self-hosted, Linux, X64, aws-staging]
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL client
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trademate-role-security"
          npm install --prefix "$RUNNER_TEMP/trademate-role-security" --no-save --no-audit --no-fund pg@8.13.1
      - name: Apply least-privilege grants and verify
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          NODE_PATH: ${{ runner.temp }}/trademate-role-security/node_modules
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${RENDER_DATABASE_URL:-}" ]]; then
            echo "::error::RENDER_DATABASE_URL repository secret is missing."
            exit 1
          fi
          node <<'NODE'
          const { Client } = require('pg');
          const sql = `
          BEGIN;
          REVOKE trademate_db_jzjt_user FROM trademate_migration_audit;
          REVOKE ALL PRIVILEGES ON DATABASE trademate_db_jzjt FROM trademate_migration_audit;
          GRANT CONNECT ON DATABASE trademate_db_jzjt TO trademate_migration_audit;
          REVOKE ALL PRIVILEGES ON SCHEMA public, trademate_private FROM trademate_migration_audit;
          GRANT USAGE ON SCHEMA public, trademate_private TO trademate_migration_audit;
          REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public, trademate_private FROM trademate_migration_audit;
          GRANT SELECT ON ALL TABLES IN SCHEMA public, trademate_private TO trademate_migration_audit;
          ALTER ROLE trademate_migration_audit SET default_transaction_read_only = on;
          COMMIT;
          `;
          (async () => {
            const client = new Client({
              connectionString: process.env.RENDER_DATABASE_URL,
              connectionTimeoutMillis: 10000,
              query_timeout: 20000,
              statement_timeout: 20000,
              application_name: 'TradeMate-migration-role-hardening',
            });
            try {
              await client.connect();
              await client.query(sql);
              const check = await client.query(`
                SELECT
                  pg_has_role('trademate_migration_audit', 'trademate_db_jzjt_user', 'MEMBER') AS inherits_owner,
                  has_database_privilege('trademate_migration_audit', 'trademate_db_jzjt', 'CONNECT') AS can_connect,
                  has_database_privilege('trademate_migration_audit', 'trademate_db_jzjt', 'CREATE') AS can_create_database,
                  has_schema_privilege('trademate_migration_audit', 'public', 'USAGE') AS public_usage,
                  has_schema_privilege('trademate_migration_audit', 'public', 'CREATE') AS public_create,
                  EXISTS (
                    SELECT 1 FROM information_schema.role_table_grants
                    WHERE grantee = 'trademate_migration_audit'
                      AND table_schema IN ('public', 'trademate_private')
                      AND privilege_type IN ('INSERT', 'UPDATE', 'DELETE', 'TRUNCATE', 'REFERENCES', 'TRIGGER')
                  ) AS has_table_write_grants,
                  (SELECT rolcreatedb OR rolcreaterole OR rolsuper
                   FROM pg_roles WHERE rolname = 'trademate_migration_audit') AS has_elevated_role_flags
              `);
              const r = check.rows[0];
              const safe = !r.inherits_owner && r.can_connect && !r.can_create_database &&
                r.public_usage && !r.public_create && !r.has_table_write_grants &&
                !r.has_elevated_role_flags;
              console.log('Migration audit role security verification:', safe ? 'PASS' : 'FAIL');
              console.log('Owner-role membership removed:', !r.inherits_owner);
              console.log('Database CONNECT only:', r.can_connect && !r.can_create_database);
              console.log('Public schema USAGE without CREATE:', r.public_usage && !r.public_create);
              console.log('No table write grants:', !r.has_table_write_grants);
              console.log('No elevated role flags:', !r.has_elevated_role_flags);
              console.log('Role default_transaction_read_only: on');
              if (!safe) process.exitCode = 1;
            } finally {
              await client.end().catch(() => {});
            }
          })().catch((error) => {
            console.error('Role hardening failed:', error.code || error.name);
            process.exit(1);
          });
          NODE
