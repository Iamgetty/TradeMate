name: AWS infrastructure template validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-infrastructure-validation.yml"
      - ".github/workflows/aws-staging-foundation-change-set.yml"
      - ".github/workflows/aws-staging-migration-task.yml"
      - ".github/workflows/aws-staging-build-images.yml"
      - ".github/workflows/aws-staging-api-promotion.yml"
  push:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-infrastructure-validation.yml"
      - ".github/workflows/aws-staging-foundation-change-set.yml"
      - ".github/workflows/aws-staging-migration-task.yml"
      - ".github/workflows/aws-staging-build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-infrastructure-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudformation-lint:
    name: Lint AWS CloudFormation templates (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Lint all staging CloudFormation templates
        run: cfn-lint infra/aws/staging/*.yaml
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint GitHub Actions workflows
        run: |
          "$HOME/go/bin/actionlint" .github/workflows/*.yml

# Intentionally no AWS credentials, CloudFormation change-set creation,
# stack deployment, resource provisioning, or production access in this workflow.
