name: AWS infrastructure template validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-infrastructure-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-infrastructure-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudformation-lint:
    name: Lint AWS CloudFormation templates (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Lint staging foundation
        run: cfn-lint infra/aws/staging/*.yaml

# Intentionally no AWS credentials, CloudFormation change-set creation,
# stack deployment, resource provisioning, or production access in this workflow.
