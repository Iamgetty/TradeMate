name: Cloudflare Workers isolated frontend validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "TradeMate-main/apps/web/**"
      - ".github/workflows/cloudflare-workers-validation.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-vinext-workers:
    name: Isolated vinext Cloudflare build and local runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: TradeMate-main/apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Create disposable frontend copy
        run: |
          mkdir -p "$RUNNER_TEMP/trademate-web"
          cp -a . "$RUNNER_TEMP/trademate-web/"
      - name: Initialize Cloudflare Workers adapter in disposable copy
        working-directory: ${{ runner.temp }}/trademate-web
        run: |
          npx --yes vinext@1.4.0 init --platform=cloudflare \
            --cdn-cache=none \
            --data-cache=none \
            --image-optimization=none \
            --no-prerender
      - name: Install isolated adapter dependencies
        working-directory: ${{ runner.temp }}/trademate-web
        run: npm install --no-audit --no-fund
      - name: Build Cloudflare Workers output
        working-directory: ${{ runner.temp }}/trademate-web
        run: npm run build:vinext
      - name: Smoke-test local Workers runtime and API proxy guard
        working-directory: ${{ runner.temp }}/trademate-web
        env:
          PORT: "4173"
        run: |
          set -euo pipefail
          npm run dev:vinext -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vinext-runtime.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ -o "$RUNNER_TEMP/vinext-home.html"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/vinext-runtime.log"
            echo "Workers local runtime did not become ready" >&2
            exit 1
          fi
          grep -q '<html' "$RUNNER_TEMP/vinext-home.html"
          proxy_status=$(curl --silent --output "$RUNNER_TEMP/vinext-proxy.txt" --write-out '%{http_code}' http://127.0.0.1:4173/api/cloudflare-validation-probe)
          test "$proxy_status" = "503"
          echo "Homepage rendered and unconfigured API proxy correctly returned HTTP 503."
# This workflow copies the frontend into RUNNER_TEMP before vinext init.
# It does not modify tracked Next.js configuration, authenticate to Cloudflare,
# create Cloudflare resources, or deploy a Worker. Cache and image optimization
# are deliberately disabled for this first isolated compatibility gate.
