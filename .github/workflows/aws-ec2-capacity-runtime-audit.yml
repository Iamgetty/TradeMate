name: AWS EC2 Capacity and Runtime Audit (Read Only)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aws-ec2-capacity-runtime-audit.yml"

permissions:
  contents: read

concurrency:
  group: aws-ec2-capacity-runtime-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Inspect host capacity and supported runtime options
    runs-on: [self-hosted, Linux, X64, aws-staging]
    timeout-minutes: 5
    steps:
      - name: Inspect host limits and runner runtime without changing anything
        shell: bash
        run: |
          set -euo pipefail
          echo "=== CPU and memory ==="
          nproc
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket):' || true
          free -h
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          echo "=== Cgroup limits (container/host resource caps) ==="
          for FILE in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/cpu.max /sys/fs/cgroup/pids.max; do
            if [ -r "$FILE" ]; then printf '%s: ' "$FILE"; cat "$FILE"; fi
          done
          echo "=== Disk and inode capacity ==="
          df -h /
          df -i /
          echo "=== Process and file-descriptor limits ==="
          ulimit -n
          ps -eo comm,rss,%cpu,%mem --sort=-rss | head -15
          echo "=== Runner service resource policy ==="
          UNIT="actions.runner.Iamgetty-TradeMate.trademate-aws-staging.service"
          if systemctl show "$UNIT" >/dev/null 2>&1; then
            systemctl show "$UNIT" --property=MemoryMax --property=CPUQuotaPerSecUSec --property=TasksMax --property=Restart --no-pager
            PID="$(systemctl show "$UNIT" --property=MainPID --value)"
            if [ "$PID" != "0" ] && [ -r "/proc/$PID/cwd" ]; then
              RUNNER_ROOT="$(readlink -f "/proc/$PID/cwd")"
              NODE24="$RUNNER_ROOT/externals/node24/bin/node"
              echo "Runner root exists: $([ -d "$RUNNER_ROOT" ] && echo yes || echo no)"
              if [ -x "$NODE24" ]; then
                echo "Runner-bundled Node 24 binary: present"
                "$NODE24" --version
                echo "Note: runner-bundled Node is for GitHub Actions internals; this does not certify it as an application runtime."
              else
                echo "Runner-bundled Node 24 binary: unavailable at expected path"
              fi
            fi
          else
            echo "Runner systemd unit not identified."
          fi
          echo "=== Runtime and package manager inventory ==="
          for BIN in node node24 npm npx corepack pnpm yarn bun; do
            if command -v "$BIN" >/dev/null 2>&1; then
              printf '%s: ' "$BIN"
              case "$BIN" in
                node|node24) "$BIN" --version ;;
                npm) "$BIN" --version ;;
                *) command -v "$BIN" ;;
              esac
            else
              echo "$BIN: unavailable on PATH"
            fi
          done
          echo "=== Application runtime installed outside PATH ==="
          NODE_HOME="$HOME/.local/opt/node-v24.22.1"
          if [ -x "$NODE_HOME/bin/node" ]; then
            echo "Node 24 application runtime: present"
            "$NODE_HOME/bin/node" --version
            "$NODE_HOME/bin/npm" --version
          else
            echo "Node 24 application runtime: absent at $NODE_HOME"
          fi
          echo "=== TradeMate service states (no environment values read) ==="
          for APP_UNIT in trademate-api.service trademate-exchange-feed.service exchange-feed.service; do
            if systemctl show "$APP_UNIT" >/dev/null 2>&1; then
              echo "--- $APP_UNIT ---"
              systemctl show "$APP_UNIT" --property=LoadState --property=ActiveState --property=SubState --property=MainPID --property=MemoryCurrent --property=ExecMainStartTimestamp --no-pager
              APP_PID="$(systemctl show "$APP_UNIT" --property=MainPID --value)"
              if [ "$APP_PID" != "0" ] && [ -r "/proc/$APP_PID/exe" ]; then
                printf 'Executable: '
                readlink -f "/proc/$APP_PID/exe"
                ps -p "$APP_PID" -o pid=,rss=,pcpu=,comm=
              fi
            else
              echo "$APP_UNIT: not installed"
            fi
          done
          echo "=== Listening application ports ==="
          ss -ltnp 2>/dev/null | grep -E ':(3000|4000)([[:space:]]|$)' || echo "No listeners on ports 3000 or 4000."
          echo "=== API environment file metadata (contents are never read) ==="
          if [ -e /etc/trademate/api.env ]; then
            stat -c 'path=%n owner=%U group=%G mode=%a size=%s' /etc/trademate/api.env
          else
            echo "/etc/trademate/api.env: absent"
          fi
          echo "=== Service manager and container runtime ==="
          command -v systemctl || true
          command -v docker || true
          command -v podman || true
          echo "Audit is read-only: no installs, downloads, service changes, network changes, database access, or secret reads."
