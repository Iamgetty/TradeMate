name: Generate API dependency lockfile

on:
  push:
    branches:
      - feat/sports-transfer-discovery-ingestion-moderation

permissions:
  contents: write

jobs:
  generate-api-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check whether lockfile is already present
        id: lockfile
        run: |
          if [ -f TradeMate-main/apps/api/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.lockfile.outputs.exists == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Generate lockfile from declared API dependencies
        if: steps.lockfile.outputs.exists == 'false'
        working-directory: TradeMate-main/apps/api
        run: npm install --no-audit --no-fund
      - name: Verify clean reproducible install
        if: steps.lockfile.outputs.exists == 'false'
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund
      - name: Commit generated lockfile
        if: steps.lockfile.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TradeMate-main/apps/api/package-lock.json
          git commit -m "build(api): add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
