name: Apply Scout map preload patch (one-off)

on:
  push:
    branches:
      - fix/scout-map-preload
    paths:
      - '.github/workflows/apply-scout-map-preload.yml'

permissions:
  contents: write

concurrency:
  group: apply-scout-map-preload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/scout-map-preload
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Apply patch to web app
        run: node .github/patches/preload-scout-map.js TradeMate-main/apps/web/public/tm/app.js
      - name: Syntax check
        run: node --check TradeMate-main/apps/web/public/tm/app.js
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Preload Scout world-map image so the map is visible when Scout opens'
          git push origin HEAD:fix/scout-map-preload
