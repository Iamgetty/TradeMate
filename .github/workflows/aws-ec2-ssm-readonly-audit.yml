name: AWS EC2 read-only SSM audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ec2-readonly-ssm-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Run fixed read-only audit on TradeMate EC2
    runs-on: ubuntu-latest
    environment: aws-ec2-ssm-audit
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials through dedicated GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_EC2_SSM_AUDIT_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-ec2-readonly-ssm-audit

      - name: Verify target is registered and online
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=i-035b1f1d00052c77e \
            --query 'InstanceInformationList[0].{InstanceId:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion,PlatformName:PlatformName}' \
            --output table

      - name: Send fixed read-only host audit
        id: send
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          # AWS CLI receives literal remote-shell commands; do not expand $x locally.
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids i-035b1f1d00052c77e \
            --document-name AWS-RunShellScript \
            --comment "TradeMate approved read-only EC2 capability audit" \
            --timeout-seconds 180 \
            --parameters 'commands=["set -eu","echo HOST; hostname","echo OS; cat /etc/os-release","echo IDENTITY; id","echo CPU_AND_MEMORY; nproc; free -h","echo DISK; df -h /","echo RUNTIME_BINARIES; for x in node npm cloudflared nginx caddy docker podman; do command -v $x || true; done","echo RELEVANT_SERVICES; systemctl is-active amazon-ssm-agent 2>/dev/null || true; systemctl is-enabled amazon-ssm-agent 2>/dev/null || true"]' \
            --query 'Command.CommandId' --output text)"
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted fixed read-only audit: $COMMAND_ID"

      - name: Wait for audit completion
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e

      - name: Print audit output
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-035b1f1d00052c77e \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json
