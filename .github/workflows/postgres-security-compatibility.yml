name: PostgreSQL security compatibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    name: PostgreSQL ${{ matrix.postgres-version }} role and RLS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: trademate_test
          POSTGRES_DB: trademate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trademate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install API dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --no-audit --no-fund
      - name: Prepare disposable pgcrypto and HMAC test key
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: |
          set -euo pipefail
          RLS_CONTEXT_HMAC_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$RLS_CONTEXT_HMAC_KEY"
          echo "RLS_CONTEXT_HMAC_KEY=$RLS_CONTEXT_HMAC_KEY" >> "$GITHUB_ENV"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;'
      - name: Apply migrations to clean PostgreSQL
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
          NODE_ENV: test
        run: npm run db:migrate
      - name: Verify routine migrations cannot rotate the RLS HMAC verifier key
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-migration-hmac-key-immutability.js
      - name: Verify pgcrypto HMAC-SHA-256 compatibility and tamper rejection
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-hmac-compatibility.js
      - name: Verify least-privilege role bootstrap and grants
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-db-roles.js
      - name: Verify CI-only RLS pilot policy behavior
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-pilot.js
      - name: Verify runtime-login RLS identity cannot be spoofed
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-rls-runtime-login.js
      - name: Verify scoped credential write operations
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-credential-write-operations.js
      - name: Verify runtime login cannot write credentials directly
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-credential-write-lockdown.js
      - name: Verify scoped auth lifecycle operations and runtime write denial
        working-directory: TradeMate-main/apps/api
        env:
          RLS_PILOT_TEST_DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-auth-lifecycle-operations.js
      - name: Build API database-context module
        working-directory: TradeMate-main/apps/api
        run: npm run build
      - name: Verify request-context and connection-pool isolation behavior
        working-directory: TradeMate-main/apps/api
        env:
          DATABASE_URL: postgres://postgres:trademate_test@localhost:5432/trademate_test
        run: node scripts/test-database-context.js
