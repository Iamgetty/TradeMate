name: TradeMate account-deletion dry run

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trademate-account-deletion-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Inspect due account-deletion requests (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out TradeMate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install API runtime dependencies
        working-directory: TradeMate-main/apps/api
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Verify worker database destination and run dry-run
        working-directory: TradeMate-main/apps/api
        env:
          WORKER_DATABASE_URL: ${{ secrets.TRADEMATE_WORKER_DATABASE_URL }}
          EXPECTED_WORKER_DB_HOST: trademate-db.cnoaequa8k6z.eu-north-1.rds.amazonaws.com
          PGSSLMODE: require
          ACCOUNT_DELETION_EXECUTE: "false"
          ACCOUNT_DELETION_LEGAL_APPROVAL: "false"
          NODE_ENV: production
        run: |
          if [ -z "$WORKER_DATABASE_URL" ]; then
            echo "::error::TRADEMATE_WORKER_DATABASE_URL is not configured. This scheduled check cannot be considered successful."
            exit 1
          fi

          ACTUAL_HOST="$(node -e 'try { process.stdout.write(new URL(process.env.WORKER_DATABASE_URL).hostname) } catch { process.exit(2) }')" || {
            echo "::error::Worker database URL is invalid."
            exit 1
          }

          if [ "$ACTUAL_HOST" != "$EXPECTED_WORKER_DB_HOST" ]; then
            echo "::error::Worker database destination is not the approved AWS RDS instance. No account-deletion query was run."
            exit 1
          fi

          echo "Worker database destination verified: approved AWS RDS instance."
          node scripts/process-account-deletions.js
