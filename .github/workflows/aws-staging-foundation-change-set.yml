name: AWS staging foundation change set

on:
  workflow_dispatch:
    inputs:
      confirm_change_set:
        description: Create a CloudFormation change set only; do not execute it.
        type: choice
        required: true
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: aws-staging-foundation-change-set
  cancel-in-progress: false

jobs:
  create-change-set:
    if: ${{ inputs.confirm_change_set == 'yes' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, aws-staging]
    environment: aws-staging
    timeout-minutes: 20
    env:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify EC2 runner and instance-role identity
        run: |
          set -euo pipefail
          echo "Runner host: $(hostname)"
          echo "Runner user: $(whoami)"
          aws --version
          IDENTITY="$(aws sts get-caller-identity --output json)"
          ACCOUNT="$(jq -r '.Account' <<< "$IDENTITY")"
          ARN="$(jq -r '.Arn' <<< "$IDENTITY")"
          if [[ "$ACCOUNT" != "661406600284" || "$ARN" != arn:aws:sts::661406600284:assumed-role/TradeMateEC2SSMRole/* ]]; then
            echo "::error::Runner is not using the expected TradeMateEC2SSMRole in the staging AWS account."
            echo "$IDENTITY"
            exit 1
          fi
          echo "Verified AWS identity: $ARN"

      - name: Validate CloudFormation template
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body file://infra/aws/staging/foundation.yaml \
            --region eu-north-1

      - name: Create foundation change set without executing it
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file infra/aws/staging/foundation.yaml \
            --stack-name trademate-staging-foundation \
            --region eu-north-1 \
            --no-execute-changeset \
            --parameter-overrides \
              EnvironmentName=trademate-staging \
              ExistingVpcId=vpc-09fcbb52e99d9ddf1 \
              NatPublicSubnetId=subnet-0f0650548512fe17f \
              ExistingDatabaseSecurityGroupId=sg-0b8c91288a83085e \
              ExistingDatabaseSubnetIds=subnet-0f0650548512fe17f,subnet-0b06dab6a814e941d,subnet-0f2479f01e7482953 \
              AppAvailabilityZoneA=eu-north-1a \
              AppAvailabilityZoneB=eu-north-1b \
              PrivateAppSubnetACidr=172.31.48.0/24 \
              PrivateAppSubnetBCidr=172.31.49.0/24 \
            --tags Environment=staging Project=TradeMate ManagedBy=CloudFormation

      - name: Print pending foundation change sets
        run: |
          aws cloudformation list-change-sets \
            --stack-name trademate-staging-foundation \
            --region eu-north-1 \
            --query 'Summaries[].[ChangeSetName,Status,ExecutionStatus,CreationTime]' \
            --output table
