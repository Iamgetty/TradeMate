name: AWS staging foundation change set

on:
  workflow_dispatch:
    inputs:
      confirm_change_set:
        description: Create a CloudFormation change set only; do not execute it.
        type: choice
        required: true
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: aws-staging-foundation-change-set
  cancel-in-progress: false

jobs:
  create-change-set:
    if: ${{ inputs.confirm_change_set == 'yes' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, aws-staging]
    environment: aws-staging
    timeout-minutes: 20
    env:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify EC2 runner and instance-role identity
        run: |
          set -euo pipefail
          echo "Runner host: $(hostname)"
          echo "Runner user: $(whoami)"
          aws --version
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          if [[ "$ACCOUNT" != "661406600284" || "$ARN" != arn:aws:sts::661406600284:assumed-role/TradeMateEC2SSMRole/* ]]; then
            echo "::error::Runner is not using the expected TradeMateEC2SSMRole in the staging AWS account."
            echo "Account: $ACCOUNT"
            echo "ARN: $ARN"
            exit 1
          fi
          echo "Verified AWS identity: $ARN"

      - name: Validate CloudFormation template
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body file://infra/aws/staging/foundation.yaml \
            --region eu-north-1

      - name: Create an explicit review-only change set
        id: change-set
        run: |
          set -euo pipefail
          STACK_NAME="trademate-staging-foundation"
          CHANGE_SET_NAME="${STACK_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PARAMETERS_FILE="$RUNNER_TEMP/trademate-cfn-parameters.json"

          # JSON preserves the comma-separated subnet IDs as one string value.
          cat > "$PARAMETERS_FILE" <<'PARAMETERS'
          [
            {"ParameterKey":"EnvironmentName","ParameterValue":"trademate-staging"},
            {"ParameterKey":"ExistingVpcId","ParameterValue":"vpc-09fcbb52e99d9ddf1"},
            {"ParameterKey":"NatPublicSubnetId","ParameterValue":"subnet-0f0650548512fe17f"},
            {"ParameterKey":"ExistingDatabaseSecurityGroupId","ParameterValue":"sg-0b8c91288a83085e"},
            {"ParameterKey":"ExistingDatabaseSubnetIds","ParameterValue":"subnet-0f0650548512fe17f,subnet-0b06dab6a814e941d,subnet-0f2479f01e7482953"},
            {"ParameterKey":"AppAvailabilityZoneA","ParameterValue":"eu-north-1a"},
            {"ParameterKey":"AppAvailabilityZoneB","ParameterValue":"eu-north-1b"},
            {"ParameterKey":"PrivateAppSubnetACidr","ParameterValue":"172.31.48.0/24"},
            {"ParameterKey":"PrivateAppSubnetBCidr","ParameterValue":"172.31.49.0/24"}
          ]
          PARAMETERS

          CHANGE_SET_ID="$(aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type CREATE \
            --template-body file://infra/aws/staging/foundation.yaml \
            --parameters "file://$PARAMETERS_FILE" \
            --tags Key=Environment,Value=staging Key=Project,Value=TradeMate Key=ManagedBy,Value=CloudFormation \
            --region eu-north-1 \
            --query Id --output text)"

          echo "Created change set: $CHANGE_SET_ID"
          echo "change_set_id=$CHANGE_SET_ID" >> "$GITHUB_OUTPUT"
          echo "change_set_name=$CHANGE_SET_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for change set and print proposed changes
        env:
          CHANGE_SET_ID: ${{ steps.change-set.outputs.change_set_id }}
          CHANGE_SET_NAME: ${{ steps.change-set.outputs.change_set_name }}
        run: |
          set -euo pipefail
          STACK_NAME="trademate-staging-foundation"

          if ! aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_ID" \
            --region eu-north-1; then
            echo "::error::Change-set creation did not complete. AWS details follow."
            aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_ID" \
              --region eu-north-1 \
              --query '{Status:Status,StatusReason:StatusReason,ExecutionStatus:ExecutionStatus}' \
              --output yaml || true
            exit 1
          fi

          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_ID" \
            --region eu-north-1 \
            --query '{ChangeSetName:ChangeSetName,Status:Status,StatusReason:StatusReason,ExecutionStatus:ExecutionStatus,Changes:Changes[].ResourceChange.[LogicalResourceId,ResourceType,Action,Replacement]}' \
            --output yaml

          echo "Review only: this workflow does not execute the change set."
