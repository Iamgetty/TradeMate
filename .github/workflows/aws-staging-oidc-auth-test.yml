name: AWS staging OIDC authentication test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-staging-oidc-auth-test
  cancel-in-progress: false

jobs:
  verify-oidc:
    name: Verify GitHub OIDC access to AWS
    runs-on: ubuntu-latest
    environment: aws-staging
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: trademate-staging-oidc-smoke-test

      - name: Verify assumed AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity
